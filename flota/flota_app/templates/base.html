{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <title>{% block title %}Sistema de Despacho{% endblock %}</title>

    <!-- ============================= -->
    <!-- 🔥 PWA -->
    <!-- ============================= -->
    <link rel="manifest" href="{% static 'flota_app/pwa/manifest.json' %}">
    <meta name="theme-color" content="#111111">

    <!-- Compatibilidad móvil -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- iOS icon -->
    <link rel="apple-touch-icon" href="{% static 'flota_app/pwa/icon-192.png' %}">

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<div class="container mt-4">

    {% block header %}{% endblock %}

    {% if messages %}
        <div class="mt-3">
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        </div>
    {% endif %}

    {% block content %}{% endblock %}
</div>

<!-- ============================= -->
<!-- JS BASE -->
<!-- ============================= -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- ============================= -->
<!-- 📲 CONTROL DE INSTALACIÓN PWA -->
<!-- ============================= -->
<script>
let deferredPrompt = null;

window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;

    const btn = document.getElementById("btn-instalar-app");
    if (btn) btn.style.display = "block";
});

function instalarApp() {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.finally(() => {
        deferredPrompt = null;
    });
}
</script>

{% if modo_pwa %}
<!-- ============================= -->
<!-- ✅ MODO PWA (APP CONDUCTOR) -->
<!-- ============================= -->
<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("{% static 'sw.js' %}")
        .then(() => console.log("✅ Service Worker registrado (PWA)"))
        .catch(err => console.error("❌ Error SW", err));
}
</script>
{% else %}
<!-- ============================= -->
<!-- 🌐 MODO WEB / CAMPO -->
<!-- ============================= -->
<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(regs => {
        regs.forEach(r => r.unregister());
        console.log("🧹 SW eliminado (web)");
    });
}

try {
    localStorage.clear();
    sessionStorage.clear();
    console.log("🧹 Storage limpiado (web)");
} catch (e) {}
</script>
{% endif %}

{% block extra_js %}{% endblock %}
</body>
</html>
