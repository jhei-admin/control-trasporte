{% extends "flota_app/base.html" %}
{% load static %}

{% block title %}Mapa en tiempo real{% endblock %}

{% block content %}

<style>

.leaflet-container{
background:#0f172a;
}

/* TOOLTIP PARADERO */

.leaflet-tooltip.paradero-label{
background:rgba(20,20,20,.85);
color:#fff;
border:none;
font-size:12px;
padding:4px 8px;
border-radius:6px;
}

/* BUS */

.bus-marker{
position:relative;
width:34px;
height:34px;
}

.bus-numero{
position:absolute;
top:-10px;
left:50%;
transform:translateX(-50%);
background:rgba(0,0,0,.85);
color:#fff;
font-size:11px;
padding:1px 6px;
border-radius:6px;
}

.bus-marker img{
width:100%;
height:100%;
transition:transform .4s linear;
filter:drop-shadow(0 3px 4px rgba(0,0,0,.6));
}

/* ESTADOS */

.bus-activo{
filter:drop-shadow(0 0 6px rgba(40,167,69,.9));
}

.bus-inactivo{
filter:none;
}

.bus-offline{
opacity:.45;
filter:grayscale(80%);
}

/* LIVE DOT */

.live-dot{
position:absolute;
top:-18px;
right:-6px;
width:8px;
height:8px;
background:#28a745;
border-radius:50%;
animation:livePulse 1.5s infinite;
}

@keyframes livePulse{
0%{box-shadow:0 0 0 0 rgba(40,167,69,.7)}
70%{box-shadow:0 0 0 8px rgba(40,167,69,0)}
100%{box-shadow:0 0 0 0 rgba(40,167,69,0)}
}

/* PUNTOS CONTROL */

.punto-control-label{
background:rgba(0,0,0,.85);
color:#fff;
font-size:11px;
font-weight:700;
padding:2px 6px;
border-radius:6px;
}

/* LAYOUT PROFESIONAL */

.map-layout{
display:grid;
grid-template-columns:280px 1fr;
height:520px;
gap:10px;
align-items:stretch;
}

.panel-unidades{
background:#111827;
color:white;
border-radius:10px;
padding:10px;
overflow-y:auto;
min-width:0;
}

.panel-header{
font-weight:700;
margin-bottom:10px;
font-size:15px;
}

.bus-item{
display:flex;
align-items:center;
gap:8px;
padding:8px;
border-radius:6px;
cursor:pointer;
transition:.2s;
}

.bus-item:hover{
background:#1f2937;
}

.bus-status{
width:10px;
height:10px;
border-radius:50%;
}

.status-activo{background:#22c55e}
.status-inactivo{background:#facc15}
.status-offline{background:#ef4444}

.map-container{
border-radius:10px;
overflow:hidden;
position:relative;
min-width:0;
background:#0f172a;
}

#map{
width:100%;
height:100%;
}

/* DASHBOARD SUPERIOR */

.dashboard-cards{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin-bottom:10px;
}

.card{
background:#0f172a;
padding:12px;
border-radius:10px;
color:white;
text-align:center;
box-shadow:0 4px 10px rgba(0,0,0,.3);
}

.card .titulo{
font-size:13px;
opacity:.8;
}

.card .numero{
font-size:22px;
font-weight:700;
}

.card.activo{border-left:4px solid #22c55e}
.card.inactivo{border-left:4px solid #facc15}
.card.offline{border-left:4px solid #ef4444}
.card.total{border-left:4px solid #3b82f6}

/* CONTROLES MAPA */

.map-controls{
display:flex;
gap:10px;
margin-bottom:10px;
}

.map-controls input{
padding:6px 10px;
border-radius:6px;
border:1px solid #ccc;
}

.map-controls button{
background:#2563eb;
color:white;
border:none;
padding:6px 10px;
border-radius:6px;
cursor:pointer;
}

.map-controls a{
background:#374151;
color:white;
padding:6px 10px;
border-radius:6px;
text-decoration:none;
}

/* BOTON FULLSCREEN */

.fullscreen-btn{
position:absolute;
bottom:100px;
right:10px;
z-index:1000;
background:white;
border:none;
border-radius:6px;
padding:6px 10px;
cursor:pointer;
box-shadow:0 2px 6px rgba(0,0,0,.3);
font-size:16px;
}

.map-container.fullscreen{
position:fixed;
top:0;
left:0;
width:100vw;
height:100vh;
z-index:9999;
border-radius:0;
}

.map-container.fullscreen #map{
height:100vh;
}

</style>

<h2 style="margin-bottom:10px;">🗺️ Mapa en tiempo real</h2>

<div class="dashboard-cards">

<div class="card activo">
<div class="titulo">🟢 Activos</div>
<div class="numero" id="cnt-activo">0</div>
</div>

<div class="card inactivo">
<div class="titulo">🟡 Inactivos</div>
<div class="numero" id="cnt-inactivo">0</div>
</div>

<div class="card offline">
<div class="titulo">🔴 Offline</div>
<div class="numero" id="cnt-offline">0</div>
</div>

<div class="card total">
<div class="titulo">🚌 Total</div>
<div class="numero" id="cnt-total">0</div>
</div>

</div>

<div class="map-controls">

<input
type="text"
id="busqueda"
placeholder="Buscar placa / código"
oninput="aplicarFiltros()"
>

<button onclick="centrarMapa()">📍 Centrar mapa</button>

<a href="{% url 'panel_despachador' %}">⬅ Panel</a>

</div>

<div class="map-layout">

    <!-- PANEL DE UNIDADES -->
    <div class="panel-unidades">

        <div class="panel-header">
            🚌 Unidades
        </div>

        <div id="lista-buses"></div>

    </div>

    <!-- MAPA -->
    <div class="map-container">

<button class="fullscreen-btn" onclick="toggleFullscreen()">⛶</button>

<div id="map"></div>

</div>

</div>

<script>

document.addEventListener("DOMContentLoaded",()=>{

const PARADERO=[-16.338088,-71.619947]
const ZOOM_PARADERO=15

const map=L.map("map",{
preferCanvas:true,
zoomAnimation:true,
fadeAnimation:false,
markerZoomAnimation:true
}).setView(PARADERO,ZOOM_PARADERO)
const listaBuses=document.getElementById("lista-buses")
let mapaCentrado=false
let actualizando=false
let mapaTimer=null
const POLL_INTERVAL_MS=8000

/* MAPBOX PRO */

L.tileLayer(
"https://api.mapbox.com/styles/v1/mapbox/navigation-night-v1/tiles/{z}/{x}/{y}?access_token={{ MAPBOX_TOKEN }}",
{
tileSize:512,
zoomOffset:-1,
maxZoom:20,
keepBuffer:6,
updateWhenZooming:true,
updateWhenIdle:false,
attribution:"© Mapbox © OpenStreetMap"
}).addTo(map)

map.zoomControl.setPosition("bottomright")
map.attributionControl.setPrefix(false)

/* CAPAS */

const capaFlota=L.layerGroup().addTo(map)
const capaParadero=L.layerGroup().addTo(map)
const capaRutas=L.layerGroup().addTo(map)
const capaPuntosControl=L.layerGroup().addTo(map)

L.control.layers(null,{
"🚌 Flota":capaFlota,
"🏁 Paradero":capaParadero,
"🛣️ Ruta":capaRutas,
"📍 Puntos de control":capaPuntosControl
}).addTo(map)

/* PARADERO */

const paraderoIcon=L.icon({
iconUrl:"{% static 'icons/paradero.png' %}",
iconSize:[36,36],
iconAnchor:[18,36]
})

L.marker(PARADERO,{icon:paraderoIcon})
.bindTooltip("Paradero",{permanent:true,className:"paradero-label"})
.addTo(capaParadero)

/* RUTA */
let routeBounds=[]
const COLORES_TRAMO=["#38bdf8","#22c55e","#f59e0b","#e879f9"]

function dibujarTramo(coords,color){
if(coords.length<2) return

L.polyline(coords,{
color:"rgba(15,23,42,.9)",
weight:10,
opacity:.85,
lineCap:"round",
lineJoin:"round"
}).addTo(capaRutas)

L.polyline(coords,{
color:color,
weight:5,
opacity:.95,
dashArray:"12,10",
lineCap:"round",
lineJoin:"round"
}).addTo(capaRutas)
}

function dividirRutaEnTramos(puntosRuta){
if(puntosRuta.length<2) return []

const tramos=[]
let tramoActual=[]
const vistos=new Set()

puntosRuta.forEach((punto,index)=>{
const coord=[punto.lat,punto.lng]
const clave=String(punto.codigo || punto.id || index)

tramoActual.push(coord)

if(index > 0 && vistos.has(clave) && tramoActual.length > 1){
tramos.push(tramoActual)
tramoActual=[coord]
vistos.clear()
}

vistos.add(clave)
})

if(tramoActual.length > 1){
tramos.push(tramoActual)
}

return tramos
}

/* PUNTOS CONTROL Y RUTAS */

fetch("/sistema/api/despachador/puntos-control/")
.then(r=>r.json())
.then(puntos=>{
const rutas=new Map()

puntos.forEach(p=>{
const coord=[p.lat,p.lng]
routeBounds.push(coord)

if(!rutas.has(p.ruta_id)){
rutas.set(p.ruta_id,[])
}

rutas.get(p.ruta_id).push(p)

L.circle(coord,{
radius:p.radio||100,
color:"#ffd54f",
fillColor:"#ffd54f",
fillOpacity:.25
}).addTo(capaPuntosControl)

L.circleMarker(coord,{
radius:6,
color:"#ff9800",
fillColor:"#ff9800"
})
.bindTooltip(p.codigo,{permanent:true,className:"punto-control-label"})
.bindPopup(`
<div style="min-width:160px">
<b>Ruta:</b> ${p.ruta || "--"}<br>
<b>Punto:</b> ${p.codigo}<br>
<b>Orden:</b> ${p.orden ?? "--"}
</div>
`)
.addTo(capaPuntosControl)

})

rutas.forEach((puntosRuta,rutaId)=>{
const tramos=dividirRutaEnTramos(puntosRuta)

tramos.forEach((coords,index)=>{
const color=COLORES_TRAMO[index % COLORES_TRAMO.length]
dibujarTramo(coords,color)
})
})

if(routeBounds.length>0 && !mapaCentrado){
map.fitBounds(routeBounds,{padding:[40,40]})
mapaCentrado=true
}

})

/* ICONOS BUS */

const ICON_BUS={
ACTIVO:"{% static 'icons/bus_green.png' %}",
INACTIVO:"{% static 'icons/bus_yellow.png' %}",
OFFLINE:"{% static 'icons/bus_red.png' %}"
}

function crearIconoBus(v){

let direccion=v.direccion||0

let estado=v.estado
let vehiculo=v.vehiculo

let clase=
estado==="ACTIVO"?"bus-activo":
estado==="INACTIVO"?"bus-inactivo":
"bus-offline"

let live=estado==="ACTIVO"?`<span class="live-dot"></span>`:""

return L.divIcon({

className:"",

html:`
<div class="bus-marker ${clase}">
${live}
<div class="bus-numero">${vehiculo}</div>
<img src="${ICON_BUS[estado]}" style="transform:rotate(${direccion}deg)">
</div>
`,

iconSize:[34,34],
iconAnchor:[17,17]

})

}

function actualizarPanel(data){

listaBuses.innerHTML=""

data.forEach(v=>{

let color=
v.estado==="ACTIVO"?"status-activo":
v.estado==="INACTIVO"?"status-inactivo":
"status-offline"

let item=document.createElement("div")

item.className="bus-item"

item.innerHTML=`
<span class="bus-status ${color}"></span>
Bus ${v.vehiculo}
<span style="margin-left:auto;font-size:11px;opacity:.7">${v.estado}</span>
`

item.onclick=()=>{

if(markers[v.vehiculo]){

map.setView(markers[v.vehiculo].getLatLng(),18,{
animate:true
})

markers[v.vehiculo].openPopup()

}

}

listaBuses.appendChild(item)

})

}

/* FILTROS */

const markers={}
const filtros={ACTIVO:true,INACTIVO:true,OFFLINE:true}

window.toggleFiltro=e=>{
filtros[e]=!filtros[e]
aplicarFiltros()
}

window.aplicarFiltros=()=>{

const texto=document.getElementById("busqueda").value.toLowerCase()

let encontrado=null

Object.values(markers).forEach(m=>{

const visible=filtros[m.estado] && m.codigo.includes(texto)

visible ? capaFlota.addLayer(m) : capaFlota.removeLayer(m)

if(texto && m.codigo.includes(texto)){
encontrado=m
}

})

/* CENTRAR MAPA EN BUS ENCONTRADO */

if(encontrado){

map.setView(encontrado.getLatLng(),18,{
animate:true,
duration:1
})

encontrado.openPopup()

}

}

window.centrarMapa=()=>{
map.setView(PARADERO,ZOOM_PARADERO)
}

window.toggleFullscreen=()=>{

const cont=document.querySelector(".map-container")

cont.classList.toggle("fullscreen")
setTimeout(()=>{
map.invalidateSize(true)
},250)

}

/* ANIMACION MOVIMIENTO BUS */

function animarMovimiento(marker,nuevaPos){

let actual=marker.getLatLng()

let latDiff=(nuevaPos[0]-actual.lat)/10
let lngDiff=(nuevaPos[1]-actual.lng)/10

let i=0

let anim=setInterval(()=>{

if(i>=10){
clearInterval(anim)
marker.setLatLng(nuevaPos)
return
}

actual.lat+=latDiff
actual.lng+=lngDiff

marker.setLatLng([actual.lat,actual.lng])

i++

},40)

}

/* GPS */

async function cargar(){
if(actualizando || document.hidden) return
actualizando=true

try{

const res=await fetch("/sistema/api/despachador/mapa/",{
cache:"no-store"
})
const data=await res.json()
actualizarPanel(data)

let a=0,i=0,o=0
let bounds=[]

data.forEach(v=>{

if(!v.lat||!v.lng)return

bounds.push([v.lat,v.lng])

if(v.estado==="ACTIVO")a++
else if(v.estado==="INACTIVO")i++
else o++

const icono=crearIconoBus(v)

if(!markers[v.vehiculo]){

const m=L.marker([v.lat,v.lng],{icon:icono})
.bindPopup(`
<div style="min-width:180px">

<b>🚌 Vehículo:</b> ${v.vehiculo}<br>
<b>Estado:</b> ${v.estado}<br>
<b>Velocidad:</b> ${v.velocidad || 0} km/h<br>
<b>Última señal:</b> ${v.fecha || "--"}<br><br>

<a href="/sistema/despachador/historial/${v.vehiculo_id}/"
class="btn btn-sm btn-primary">
📊 Ver historial
</a>

</div>
`)
.addTo(capaFlota)

m.estado=v.estado
m.codigo=String(v.vehiculo).toLowerCase()

markers[v.vehiculo]=m

}else{

animarMovimiento(markers[v.vehiculo],[v.lat,v.lng])
markers[v.vehiculo].setIcon(icono)
markers[v.vehiculo].estado=v.estado

}

})

document.getElementById("cnt-activo").innerText=a
document.getElementById("cnt-inactivo").innerText=i
document.getElementById("cnt-offline").innerText=o
document.getElementById("cnt-total").innerText=data.length

aplicarFiltros()

if(bounds.length>0 && !mapaCentrado){
map.fitBounds(bounds,{padding:[40,40]})
mapaCentrado=true
}

}catch(error){
console.error("Error cargando mapa:",error)
}finally{
actualizando=false
}

}

cargar()

function iniciarPollingMapa(){
if(mapaTimer){
clearInterval(mapaTimer)
}

mapaTimer=setInterval(cargar,POLL_INTERVAL_MS)
}

document.addEventListener("visibilitychange",()=>{
if(document.hidden){
return
}

cargar()
})

iniciarPollingMapa()

window.addEventListener("resize",()=>{
requestAnimationFrame(()=>{
map.invalidateSize(true)
})
})

map.whenReady(()=>{
setTimeout(()=>{
map.invalidateSize(true)
},150)
})

})

</script>

{% endblock %}
