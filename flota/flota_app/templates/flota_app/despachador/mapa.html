{% extends "flota_app/base.html" %}
{% load static %}

{% block title %}Mapa en tiempo real{% endblock %}

{% block content %}

<style>

.leaflet-container{
background:#0f172a;
}

/* TOOLTIP PARADERO */

.leaflet-tooltip.paradero-label{
background:rgba(20,20,20,.85);
color:#fff;
border:none;
font-size:12px;
padding:4px 8px;
border-radius:6px;
}

/* BUS */

.bus-marker{
position:relative;
width:34px;
height:34px;
}

.bus-numero{
position:absolute;
top:-10px;
left:50%;
transform:translateX(-50%);
background:rgba(0,0,0,.85);
color:#fff;
font-size:11px;
padding:1px 6px;
border-radius:6px;
}

.bus-marker img{
width:100%;
height:100%;
transition:transform .4s linear;
filter:drop-shadow(0 3px 4px rgba(0,0,0,.6));
}

/* ESTADOS */

.bus-activo{
filter:drop-shadow(0 0 6px rgba(40,167,69,.9));
}

.bus-inactivo{
filter:none;
}

.bus-offline{
opacity:.45;
filter:grayscale(80%);
}

/* LIVE DOT */

.live-dot{
position:absolute;
top:-18px;
right:-6px;
width:8px;
height:8px;
background:#28a745;
border-radius:50%;
animation:livePulse 1.5s infinite;
}

@keyframes livePulse{
0%{box-shadow:0 0 0 0 rgba(40,167,69,.7)}
70%{box-shadow:0 0 0 8px rgba(40,167,69,0)}
100%{box-shadow:0 0 0 0 rgba(40,167,69,0)}
}

/* PUNTOS CONTROL */

.punto-control-label{
background:rgba(0,0,0,.85);
color:#fff;
font-size:11px;
font-weight:700;
padding:2px 6px;
border-radius:6px;
}

/* LAYOUT PROFESIONAL */

.map-layout{
display:grid;
grid-template-columns:280px 1fr;
height:520px;
gap:10px;
align-items:stretch;
}

.panel-unidades{
background:#111827;
color:white;
border-radius:10px;
padding:10px;
overflow-y:auto;
min-width:0;
}

.panel-header{
font-weight:700;
margin-bottom:10px;
font-size:15px;
}

.bus-item{
display:flex;
align-items:center;
gap:8px;
padding:8px;
border-radius:6px;
cursor:pointer;
transition:.2s;
}

.bus-item:hover{
background:#1f2937;
}

.bus-status{
width:10px;
height:10px;
border-radius:50%;
}

.status-activo{background:#22c55e}
.status-inactivo{background:#facc15}
.status-offline{background:#ef4444}

.map-container{
border-radius:10px;
overflow:hidden;
position:relative;
min-width:0;
background:#0f172a;
}

#map{
width:100%;
height:100%;
}

/* DASHBOARD SUPERIOR */

.dashboard-cards{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin-bottom:10px;
}

.card{
background:#0f172a;
padding:12px;
border-radius:10px;
color:white;
text-align:center;
box-shadow:0 4px 10px rgba(0,0,0,.3);
}

.card .titulo{
font-size:13px;
opacity:.8;
}

.card .numero{
font-size:22px;
font-weight:700;
}

.card.activo{border-left:4px solid #22c55e}
.card.inactivo{border-left:4px solid #facc15}
.card.offline{border-left:4px solid #ef4444}
.card.total{border-left:4px solid #3b82f6}

/* CONTROLES MAPA */

.map-controls{
display:flex;
gap:10px;
margin-bottom:10px;
}

.map-controls input{
padding:6px 10px;
border-radius:6px;
border:1px solid #ccc;
}

.map-controls button{
background:#2563eb;
color:white;
border:none;
padding:6px 10px;
border-radius:6px;
cursor:pointer;
}

.map-controls a{
background:#374151;
color:white;
padding:6px 10px;
border-radius:6px;
text-decoration:none;
}

/* BOTON FULLSCREEN */

.fullscreen-btn{
position:absolute;
bottom:100px;
right:10px;
z-index:1000;
background:white;
border:none;
border-radius:6px;
padding:6px 10px;
cursor:pointer;
box-shadow:0 2px 6px rgba(0,0,0,.3);
font-size:16px;
}

.map-container.fullscreen{
position:fixed;
top:0;
left:0;
width:100vw;
height:100vh;
z-index:9999;
border-radius:0;
}

.map-container.fullscreen #map{
height:100vh;
}

</style>

<h2 style="margin-bottom:10px;">🗺️ Mapa en tiempo real</h2>

<div class="dashboard-cards">

<div class="card activo">
<div class="titulo">🟢 Activos</div>
<div class="numero" id="cnt-activo">0</div>
</div>

<div class="card inactivo">
<div class="titulo">🟡 Inactivos</div>
<div class="numero" id="cnt-inactivo">0</div>
</div>

<div class="card offline">
<div class="titulo">🔴 Offline</div>
<div class="numero" id="cnt-offline">0</div>
</div>

<div class="card total">
<div class="titulo">🚌 Total</div>
<div class="numero" id="cnt-total">0</div>
</div>

</div>

<div class="map-controls">

<input
type="text"
id="busqueda"
placeholder="Buscar placa / código"
oninput="aplicarFiltros()"
>

<button onclick="centrarMapa()">📍 Centrar mapa</button>

<a href="{% url 'panel_despachador' %}">⬅ Panel</a>

</div>

<div class="map-layout">

    <!-- PANEL DE UNIDADES -->
    <div class="panel-unidades">

        <div class="panel-header">
            🚌 Unidades
        </div>

        <div id="lista-buses"></div>

    </div>

    <!-- MAPA -->
    <div class="map-container">

<button class="fullscreen-btn" onclick="toggleFullscreen()">⛶</button>

<div id="map"></div>

</div>

</div>

<script>

document.addEventListener("DOMContentLoaded",()=>{

const PARADERO=[-16.338088,-71.619947]
const ZOOM_PARADERO=15

const map=L.map("map",{
preferCanvas:true,
zoomAnimation:true,
fadeAnimation:false,
markerZoomAnimation:true
}).setView(PARADERO,ZOOM_PARADERO)
const listaBuses=document.getElementById("lista-buses")
let mapaCentrado=false
let actualizando=false

/* MAPBOX PRO */

L.tileLayer(
"https://api.mapbox.com/styles/v1/mapbox/navigation-night-v1/tiles/{z}/{x}/{y}?access_token={{ MAPBOX_TOKEN }}",
{
tileSize:512,
zoomOffset:-1,
maxZoom:20,
keepBuffer:6,
updateWhenZooming:true,
updateWhenIdle:false,
attribution:"© Mapbox © OpenStreetMap"
}).addTo(map)

map.zoomControl.setPosition("bottomright")
map.attributionControl.setPrefix(false)

/* CAPAS */

const capaFlota=L.layerGroup().addTo(map)
const capaParadero=L.layerGroup().addTo(map)
const capaRutas=L.layerGroup().addTo(map)
const capaPuntosControl=L.layerGroup().addTo(map)

L.control.layers(null,{
"🚌 Flota":capaFlota,
"🏁 Paradero":capaParadero,
"🛣️ Ruta":capaRutas,
"📍 Puntos de control":capaPuntosControl
}).addTo(map)

/* PARADERO */

const paraderoIcon=L.icon({
iconUrl:"{% static 'icons/paradero.png' %}",
iconSize:[36,36],
iconAnchor:[18,36]
})

L.marker(PARADERO,{icon:paraderoIcon})
.bindTooltip("Paradero",{permanent:true,className:"paradero-label"})
.addTo(capaParadero)

/* RUTA */

const RUTA_FIJA=[

[-16.33822826038497, -71.62108004093172],
    [-16.3384959453393, -71.62006080150606],
    [-16.338999060149316, -71.6181242465973],
    [-16.33950354103728, -71.61635398864748],
    [-16.335910373260862, -71.6153132915497],
    [-16.335045532186186, -71.61512017250062],
    [-16.334118912503364, -71.61426186561586],
    [-16.333727671763064, -71.61367177963258],
    [-16.33406743350332, -71.61221265792848],
    [-16.33423216625574, -71.61154747009279],
    [-16.333048146511228, -71.61120414733888],
    [-16.33287311689718, -71.61063551902772],
    [-16.332008262386758, -71.610324382782],
    [-16.331967078743226, -71.61033511161806],
    [-16.331709680774605, -71.61124706268312],
    [-16.331575833697013, -71.61181569099428],
    [-16.331174291914554, -71.61327481269838],
    [-16.329894854605975, -71.61216974258424],
    [-16.326044104814017, -71.60888671875001],
    [-16.325076257383078, -71.60802841186525],
    [-16.323717144396525, -71.60682678222658],
    [-16.32221660705363, -71.60595774650575],
    [-16.32131051953444, -71.60549640655519],
    [-16.32030146258623, -71.60498142242433],
    [-16.318870240235526, -71.60414457321168],
    [-16.318221553276814, -71.60375833511354],
    [-16.317644940841774, -71.60350084304811],
    [-16.318118586895153, -71.60278201103212],
    [-16.319405662772066, -71.60101175308229],
    [-16.320754509206658, -71.59918785095216],
    [-16.321753267369182, -71.59808278083803],
    [-16.32261816722592, -71.59754633903505],
    [-16.323575730464615, -71.59695625305177],
    [-16.325099584879133, -71.59605503082277],
    [-16.326860239725523, -71.59497141838075],
    [-16.32920775486741, -71.59400582313539],
    [-16.330515349766745, -71.59351229667665],
    [-16.331895007346166, -71.59297585487367],
    [-16.335302925763084, -71.59160256385805],
    [-16.337660635156805, -71.59069061279298],
    [-16.33879314920856, -71.5901005268097],
    [-16.339874179227195, -71.58912420272829],
    [-16.34046102159031, -71.588351726532],
    [-16.34078018073219, -71.58792257308961],
    [-16.34129495244331, -71.58725738525392],
    [-16.342190651988073, -71.58569097518922],
    [-16.342520103661407, -71.58499360084535],
    [-16.342726010675154, -71.58307313919069],
    [-16.34268482928975, -71.58180713653566],
    [-16.342808373419903, -71.58038020133974],
    [-16.34290103146623, -71.57854557037355],
    [-16.343323139787973, -71.57727956771852],
    [-16.34415705842613, -71.57639980316164],
    [-16.345289534828296, -71.57539129257204],
    [-16.346186583387105, -71.57459735870363],
    [-16.34848858433535, -71.57264471054079],
    [-16.350321093140277, -71.57103538513185],
    [-16.35196827739192, -71.56949043273927],
    [-16.353615447749604, -71.56822443008424],
    [-16.355056710414207, -71.56680822372438],
    [-16.357033281910333, -71.56500577926637],
    [-16.359998101629834, -71.56243085861207]

]

/* BORDE NEGRO */

L.polyline(RUTA_FIJA,{
color:"#000",
weight:16,
opacity:.7
}).addTo(capaRutas)

/* CARRETERA */

L.polyline(RUTA_FIJA,{
color:"#e5e5e5",
weight:12,
opacity:.95
}).addTo(capaRutas)

/* LINEA CENTRAL */

L.polyline(RUTA_FIJA,{
color:"#00e5ff",
weight:4,
dashArray:"10,10",
opacity:.9
}).addTo(capaRutas)

/* PUNTOS CONTROL */

fetch("/sistema/api/despachador/puntos-control/")
.then(r=>r.json())
.then(puntos=>{

puntos.forEach(p=>{

L.circle([p.lat,p.lng],{
radius:p.radio||100,
color:"#ffd54f",
fillColor:"#ffd54f",
fillOpacity:.25
}).addTo(capaPuntosControl)

L.circleMarker([p.lat,p.lng],{
radius:6,
color:"#ff9800",
fillColor:"#ff9800"
})
.bindTooltip(p.codigo,{permanent:true,className:"punto-control-label"})
.addTo(capaPuntosControl)

})

})

/* ICONOS BUS */

const ICON_BUS={
ACTIVO:"{% static 'icons/bus_green.png' %}",
INACTIVO:"{% static 'icons/bus_yellow.png' %}",
OFFLINE:"{% static 'icons/bus_red.png' %}"
}

function crearIconoBus(v){

let direccion=v.direccion||0

let estado=v.estado
let vehiculo=v.vehiculo

let clase=
estado==="ACTIVO"?"bus-activo":
estado==="INACTIVO"?"bus-inactivo":
"bus-offline"

let live=estado==="ACTIVO"?`<span class="live-dot"></span>`:""

return L.divIcon({

className:"",

html:`
<div class="bus-marker ${clase}">
${live}
<div class="bus-numero">${vehiculo}</div>
<img src="${ICON_BUS[estado]}" style="transform:rotate(${direccion}deg)">
</div>
`,

iconSize:[34,34],
iconAnchor:[17,17]

})

}

function actualizarPanel(data){

listaBuses.innerHTML=""

data.forEach(v=>{

let color=
v.estado==="ACTIVO"?"status-activo":
v.estado==="INACTIVO"?"status-inactivo":
"status-offline"

let item=document.createElement("div")

item.className="bus-item"

item.innerHTML=`
<span class="bus-status ${color}"></span>
Bus ${v.vehiculo}
<span style="margin-left:auto;font-size:11px;opacity:.7">${v.estado}</span>
`

item.onclick=()=>{

if(markers[v.vehiculo]){

map.setView(markers[v.vehiculo].getLatLng(),18,{
animate:true
})

markers[v.vehiculo].openPopup()

}

}

listaBuses.appendChild(item)

})

}

/* FILTROS */

const markers={}
const filtros={ACTIVO:true,INACTIVO:true,OFFLINE:true}

window.toggleFiltro=e=>{
filtros[e]=!filtros[e]
aplicarFiltros()
}

window.aplicarFiltros=()=>{

const texto=document.getElementById("busqueda").value.toLowerCase()

let encontrado=null

Object.values(markers).forEach(m=>{

const visible=filtros[m.estado] && m.codigo.includes(texto)

visible ? capaFlota.addLayer(m) : capaFlota.removeLayer(m)

if(texto && m.codigo.includes(texto)){
encontrado=m
}

})

/* CENTRAR MAPA EN BUS ENCONTRADO */

if(encontrado){

map.setView(encontrado.getLatLng(),18,{
animate:true,
duration:1
})

encontrado.openPopup()

}

}

window.centrarMapa=()=>{
map.setView(PARADERO,ZOOM_PARADERO)
}

window.toggleFullscreen=()=>{

const cont=document.querySelector(".map-container")

cont.classList.toggle("fullscreen")
setTimeout(()=>{
map.invalidateSize(true)
},250)

}

/* ANIMACION MOVIMIENTO BUS */

function animarMovimiento(marker,nuevaPos){

let actual=marker.getLatLng()

let latDiff=(nuevaPos[0]-actual.lat)/10
let lngDiff=(nuevaPos[1]-actual.lng)/10

let i=0

let anim=setInterval(()=>{

if(i>=10){
clearInterval(anim)
marker.setLatLng(nuevaPos)
return
}

actual.lat+=latDiff
actual.lng+=lngDiff

marker.setLatLng([actual.lat,actual.lng])

i++

},40)

}

/* GPS */

async function cargar(){
if(actualizando) return
actualizando=true

try{

const res=await fetch("/sistema/api/despachador/mapa/",{
cache:"no-store"
})
const data=await res.json()
actualizarPanel(data)

let a=0,i=0,o=0
let bounds=[]

data.forEach(v=>{

if(!v.lat||!v.lng)return

bounds.push([v.lat,v.lng])

if(v.estado==="ACTIVO")a++
else if(v.estado==="INACTIVO")i++
else o++

const icono=crearIconoBus(v)

if(!markers[v.vehiculo]){

const m=L.marker([v.lat,v.lng],{icon:icono})
.bindPopup(`
<div style="min-width:180px">

<b>🚌 Vehículo:</b> ${v.vehiculo}<br>
<b>Estado:</b> ${v.estado}<br>
<b>Velocidad:</b> ${v.velocidad || 0} km/h<br>
<b>Última señal:</b> ${v.fecha || "--"}<br><br>

<a href="/sistema/despachador/historial/${v.vehiculo_id}/"
class="btn btn-sm btn-primary">
📊 Ver historial
</a>

</div>
`)
.addTo(capaFlota)

m.estado=v.estado
m.codigo=String(v.vehiculo).toLowerCase()

markers[v.vehiculo]=m

}else{

animarMovimiento(markers[v.vehiculo],[v.lat,v.lng])
markers[v.vehiculo].setIcon(icono)
markers[v.vehiculo].estado=v.estado

}

})

document.getElementById("cnt-activo").innerText=a
document.getElementById("cnt-inactivo").innerText=i
document.getElementById("cnt-offline").innerText=o
document.getElementById("cnt-total").innerText=data.length

aplicarFiltros()

if(bounds.length>0 && !mapaCentrado){
map.fitBounds(bounds,{padding:[40,40]})
mapaCentrado=true
}

}catch(error){
console.error("Error cargando mapa:",error)
}finally{
actualizando=false
}

}

cargar()

setInterval(cargar,4000)

window.addEventListener("resize",()=>{
requestAnimationFrame(()=>{
map.invalidateSize(true)
})
})

map.whenReady(()=>{
setTimeout(()=>{
map.invalidateSize(true)
},150)
})

})

</script>

{% endblock %}
