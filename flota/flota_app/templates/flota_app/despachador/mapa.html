{% extends "flota_app/base.html" %}
{% load static %}

{% block title %}Mapa en tiempo real{% endblock %}

{% block content %}

<style>

.leaflet-container{
background:#0f172a;
}

/* TOOLTIP PARADERO */

.leaflet-tooltip.paradero-label{
background:rgba(20,20,20,.85);
color:#fff;
border:none;
font-size:12px;
padding:4px 8px;
border-radius:6px;
}

/* BUS */

.bus-marker{
position:relative;
width:52px;
height:52px;
}

.bus-numero{
position:absolute;
top:-12px;
left:50%;
transform:translateX(-50%);
background:rgba(0,0,0,.85);
color:#fff;
font-size:11px;
padding:1px 6px;
border-radius:6px;
}

.bus-marker img{
width:100%;
height:100%;
transition:transform .4s linear;
filter:drop-shadow(0 3px 4px rgba(0,0,0,.6));
}

.bus-sentido-indicator{
position:absolute;
right:-34px;
top:-18px;
display:flex;
align-items:center;
gap:4px;
padding:3px 6px;
border-radius:999px;
font-size:10px;
font-weight:900;
letter-spacing:.02em;
color:#fff;

}

.ocultar-etiquetas-sentido .bus-sentido-indicator{

}

.bus-sentido-arrow{

height:0;

.sentido-desconocido{

.sentido-rumbo{

}

.sentido-chip{

.bus-popup-sub{

.bus-popup-body{

.bus-popup-route{

.bus-popup-grid{

.bus-popup-item{

.bus-popup-label{
display:block;
font-size:10px;
font-weight:900;
letter-spacing:.06em;
text-transform:uppercase;
color:#64748b;
}

.bus-popup-value{
display:block;
font-size:15px;
font-weight:900;
color:#0f172a;
margin-top:4px;
}

.bus-popup-note{
display:block;
font-size:10px;
color:#64748b;
margin-top:2px;
}

.bus-popup-action{
display:flex;
align-items:center;
justify-content:center;
margin-top:12px;
width:100%;
border-radius:8px;
padding:10px 12px;

}

.ruta-direction-arrow{

height:0;

border-right:7px solid transparent;
border-bottom:18px solid #ffffff;
filter:drop-shadow(0 0 3px #00e5ff) drop-shadow(0 2px 4px rgba(0,0,0,.65));
transform-origin:50% 60%;

right:-6px;

70%{box-shadow:0 0 0 8px rgba(40,167,69,0)}

/* PUNTOS CONTROL */

.punto-control-label{

font-size:11px;

border-radius:6px;

/* LAYOUT PROFESIONAL */

.map-layout{

gap:10px;

.panel-unidades{

padding:10px;

.panel-header{

.bus-item{

align-items:center;
gap:8px;
padding:8px;
border-radius:6px;

transition:.2s;
}

.bus-item:hover{

}

.bus-status{
width:10px;
height:10px;
border-radius:50%;
}

.status-activo{background:#22c55e}
.status-inactivo{background:#facc15}
.status-offline{background:#ef4444}

.map-container{
border-radius:10px;
overflow:hidden;
position:relative;
min-width:0;
background:#0f172a;
}

#map{
width:100%;
height:100%;
}

/* DASHBOARD SUPERIOR */

.dashboard-cards{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin-bottom:10px;
}

.card{
background:#0f172a;
padding:12px;
border-radius:10px;
color:white;
text-align:center;
box-shadow:0 4px 10px rgba(0,0,0,.3);
}

.card .titulo{
font-size:13px;

}

.card .numero{
font-size:22px;
font-weight:700;
}

.card.activo{border-left:4px solid #22c55e}
.card.inactivo{border-left:4px solid #facc15}
.card.offline{border-left:4px solid #ef4444}
.card.total{border-left:4px solid #3b82f6}

/* CONTROLES MAPA */

.map-controls{
display:flex;
gap:10px;
margin-bottom:10px;
}

.map-controls input{

}

.map-controls button{

color:white;
border:none;
padding:6px 10px;
border-radius:6px;

}

.map-controls a{

color:white;
padding:6px 10px;
border-radius:6px;
text-decoration:none;
}

/* BOTON FULLSCREEN */

.fullscreen-btn{
position:absolute;
bottom:100px;
right:10px;
z-index:1000;
background:white;
border:none;
border-radius:6px;
padding:6px 10px;
cursor:pointer;
box-shadow:0 2px 6px rgba(0,0,0,.3);
font-size:16px;
}

.map-container.fullscreen{
position:fixed;
top:0;
left:0;
width:100vw;
height:100vh;
z-index:9999;

}

.map-container.fullscreen #map{

</style>

<h2 style="margin-bottom:10px;">🗺️ Mapa en tiempo real</h2>

<div class="dashboard-cards">

<div class="card activo">
<div class="titulo">🟢 Activos</div>
<div class="numero" id="cnt-activo">0</div>
</div>

<div class="card inactivo">
<div class="titulo">🟡 Inactivos</div>

</div>

</div>

<input
type="text"
id="busqueda"
placeholder="Buscar placa / código"
oninput="aplicarFiltros()"
>

<select id="filtro-ruta" onchange="cambiarRuta()">
<option value="">Todas las rutas</option>
</select>

<div class="map-layout">

    <!-- PANEL DE UNIDADES -->
    <div class="panel-unidades">

        <div class="panel-header">
            🚌 Unidades
        </div>

        <div id="lista-buses"></div>

    </div>

    <!-- MAPA -->
    <div class="map-container">

<button class="fullscreen-btn" onclick="toggleFullscreen()">⛶</button>

<div id="map"></div>

</div>

<script>

document.addEventListener("DOMContentLoaded",()=>{

const PARADERO=[-16.338088,-71.619947]
const ZOOM_PARADERO=15

const map=L.map("map",{
preferCanvas:true,
zoomAnimation:true,
fadeAnimation:false,
markerZoomAnimation:true
}).setView(PARADERO,ZOOM_PARADERO)
const listaBuses=document.getElementById("lista-buses")
const filtroRuta=document.getElementById("filtro-ruta")
let mapaCentrado=true
let actualizando=false
let mapaTimer=null
const POLL_INTERVAL_MS=8000
let rutaSeleccionada=""
let puntosControlData=[]

/* MAPBOX PRO */

L.tileLayer(
"https://api.mapbox.com/styles/v1/mapbox/navigation-night-v1/tiles/{z}/{x}/{y}?access_token={{ MAPBOX_TOKEN }}",
{
tileSize:512,
zoomOffset:-1,
maxZoom:20,
keepBuffer:6,
updateWhenZooming:true,
updateWhenIdle:false,
attribution:"© Mapbox © OpenStreetMap"
}).addTo(map)

map.zoomControl.setPosition("bottomright")
map.attributionControl.setPrefix(false)

/* CAPAS */

const capaFlota=L.layerGroup().addTo(map)
const capaParadero=L.layerGroup().addTo(map)
const capaRutas=L.layerGroup().addTo(map)
const capaPuntosControl=L.layerGroup().addTo(map)
const capaEtiquetasSentido=L.layerGroup().addTo(map)

const controlCapas=L.control.layers(null,{
"🚌 Flota":capaFlota,
"🏁 Paradero":capaParadero,
"🛣️ Ruta":capaRutas,
"📍 Puntos de control":capaPuntosControl
}).addTo(map)

controlCapas.addOverlay(capaEtiquetasSentido,"Sentido B/R")

map.on("overlayadd",e=>{
if(e.layer===capaEtiquetasSentido){
map.getContainer().classList.remove("ocultar-etiquetas-sentido")
}
})

map.on("overlayremove",e=>{
if(e.layer===capaEtiquetasSentido){
map.getContainer().classList.add("ocultar-etiquetas-sentido")
}
})

/* PARADERO */

const paraderoIcon=L.icon({
iconUrl:"{% static 'icons/paradero.png' %}",
iconSize:[36,36],
iconAnchor:[18,36]
})

L.marker(PARADERO,{icon:paraderoIcon})
.bindTooltip("Paradero",{permanent:true,className:"paradero-label"})
.addTo(capaParadero)

/* RUTA REAL */

const rutasGeometria = {{ rutas_geometria_json|default:"[]"|safe }}

function esCoordValida(coord){
return Array.isArray(coord) && coord.length===2 && Number.isFinite(Number(coord[0])) && Number.isFinite(Number(coord[1]))
}

function distanciaMetrosEntre(a,b){
const lat1=Number(a[0]) * Math.PI / 180
const lat2=Number(b[0]) * Math.PI / 180
const dLat=(Number(b[0])-Number(a[0])) * Math.PI / 180
const dLng=(Number(b[1])-Number(a[1])) * Math.PI / 180
const h=Math.sin(dLat/2)**2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng/2)**2
return 6371000 * 2 * Math.atan2(Math.sqrt(h),Math.sqrt(1-h))
}

function calcularRumboSegmento(a,b){
const lat1=Number(a[0]) * Math.PI / 180
const lat2=Number(b[0]) * Math.PI / 180
const dLng=(Number(b[1])-Number(a[1])) * Math.PI / 180
const y=Math.sin(dLng) * Math.cos(lat2)
const x=Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLng)
return (Math.atan2(y,x) * 180 / Math.PI + 360) % 360
}

function diferenciaAngular(a,b){
return Math.abs(((Number(a)-Number(b)+540) % 360) - 180)
}

function distanciaPuntoSegmentoMetros(p,a,b){
const refLat=(Number(p[0])+Number(a[0])+Number(b[0]))/3
const metrosLat=110540
const metrosLng=111320 * Math.cos(refLat * Math.PI / 180)
const px=Number(p[1]) * metrosLng
const py=Number(p[0]) * metrosLat
const ax=Number(a[1]) * metrosLng
const ay=Number(a[0]) * metrosLat
const bx=Number(b[1]) * metrosLng
const by=Number(b[0]) * metrosLat
const dx=bx-ax
const dy=by-ay
const largo2=dx*dx + dy*dy
const t=largo2===0 ? 0 : Math.max(0,Math.min(1,((px-ax)*dx + (py-ay)*dy)/largo2))
const cx=ax + t*dx
const cy=ay + t*dy
return Math.hypot(px-cx,py-cy)
}

function crearIconoFlechaRuta(angulo){
return L.divIcon({
className:"",
html:`<div class="ruta-direction-arrow" style="transform:rotate(${angulo}deg)"></div>`,
iconSize:[18,18],
iconAnchor:[9,9]
})
}

function dibujarFlechasRuta(coords){
let acumulado=0

for(let idx=0; idx<coords.length-1; idx++){
const a=coords[idx]
const b=coords[idx+1]
if(!esCoordValida(a) || !esCoordValida(b)) continue

const distancia=distanciaMetrosEntre(a,b)
if(distancia<20) continue

acumulado+=distancia

if(acumulado<450) continue

const puntoMedio=[(Number(a[0])+Number(b[0]))/2,(Number(a[1])+Number(b[1]))/2]
const rumbo=calcularRumboSegmento(a,b)
L.marker(puntoMedio,{icon:crearIconoFlechaRuta(rumbo),interactive:false}).addTo(capaRutas)
acumulado=0
}
}

function rutasCandidatasVehiculo(v){
const rutaId=String(v.ruta_id || "")
const exactas=rutaId ? rutasGeometria.filter(r=>String(r.id)===rutaId) : []
return exactas.length ? exactas : rutasGeometria
}

function medirRuta(ruta){
if(ruta._medicion) return ruta._medicion

const coords=Array.isArray(ruta.geometria) ? ruta.geometria : []
let total=0
const segmentos=[]

for(let idx=0; idx<coords.length-1; idx++){
const a=coords[idx]
const b=coords[idx+1]
if(!esCoordValida(a) || !esCoordValida(b)) continue

const largo=distanciaMetrosEntre(a,b)
if(largo<2) continue

segmentos.push({
a,
b,
inicio:total,
largo,
rumbo:calcularRumboSegmento(a,b)
})
total+=largo
}

ruta._medicion={total,segmentos}
return ruta._medicion
}

function ubicarVehiculoEnRuta(v){
const posicion=[Number(v.lat),Number(v.lng)]
if(!esCoordValida(posicion)) return null

let mejor=null

rutasCandidatasVehiculo(v).forEach(ruta=>{
const medicion=medirRuta(ruta)

medicion.segmentos.forEach(segmento=>{
const distancia=distanciaPuntoSegmentoMetros(posicion,segmento.a,segmento.b)
if(mejor && distancia>=mejor.distancia) return

const refLat=(Number(posicion[0])+Number(segmento.a[0])+Number(segmento.b[0]))/3
const metrosLat=110540
const metrosLng=111320 * Math.cos(refLat * Math.PI / 180)
const px=Number(posicion[1]) * metrosLng
const py=Number(posicion[0]) * metrosLat
const ax=Number(segmento.a[1]) * metrosLng
const ay=Number(segmento.a[0]) * metrosLat
const bx=Number(segmento.b[1]) * metrosLng
const by=Number(segmento.b[0]) * metrosLat
const dx=bx-ax
const dy=by-ay
const largo2=dx*dx + dy*dy
const t=largo2===0 ? 0 : Math.max(0,Math.min(1,((px-ax)*dx + (py-ay)*dy)/largo2))

mejor={
rutaId:String(ruta.id),
distancia,
progreso:segmento.inicio + t * segmento.largo,
total:medicion.total,
rumboSegmento:segmento.rumbo
}
})
})

return mejor
}

function detectarSentidoVehiculo(v,markerAnterior=null){
const direccion=Number(v.direccion)
const posicion=[Number(v.lat),Number(v.lng)]
const velocidad=Number(v.velocidad || 0)

if(!esCoordValida(posicion)){
return {codigo:"DESCONOCIDO",texto:"Sin rumbo",corto:"--",clase:"sentido-desconocido",rumboVisual:markerAnterior?.rumboVisual || 0}
}

let rumboVisual=Number.isFinite(direccion) ? direccion : (markerAnterior?.rumboVisual || 0)
let movimientoMetros=0
let movimientoConfiable=false

if(markerAnterior?.latUltima && markerAnterior?.lngUltima){
const anterior=[markerAnterior.latUltima,markerAnterior.lngUltima]
movimientoMetros=distanciaMetrosEntre(anterior,posicion)

if(movimientoMetros>=8){
rumboVisual=calcularRumboSegmento(anterior,posicion)
movimientoConfiable=true
}
}

const ubicacion=ubicarVehiculoEnRuta(v)
const base={
rumboVisual,
progresoRuta:ubicacion?.progreso ?? markerAnterior?.progresoRuta ?? null,
rutaDeteccion:ubicacion?.rutaId ?? markerAnterior?.rutaDeteccion ?? null,
distanciaRuta:ubicacion?.distancia ?? null
}

if(markerAnterior?.sentidoInfo && !movimientoConfiable && velocidad<3){
return {
...markerAnterior.sentidoInfo,
...base,
texto:markerAnterior.sentidoInfo.texto,
rumboVisual:markerAnterior.rumboVisual ?? rumboVisual
}
}

if(!ubicacion || ubicacion.distancia>350){
return {...base,codigo:"RUMBO",texto:"Rumbo GPS",corto:"GPS",clase:"sentido-rumbo"}
}

if(markerAnterior?.progresoRuta!=null && markerAnterior?.rutaDeteccion===ubicacion.rutaId && movimientoConfiable){
let delta=ubicacion.progreso-markerAnterior.progresoRuta

if(ubicacion.total && Math.abs(delta)>ubicacion.total/2){
delta=delta>0 ? delta-ubicacion.total : delta+ubicacion.total
}

if(Math.abs(delta)>=6){
return delta>=0
? {...base,codigo:"BAJADA",texto:"Bajada",corto:"B",clase:"sentido-bajada"}
: {...base,codigo:"RETORNO",texto:"Retorno",corto:"R",clase:"sentido-retorno"}
}
}

if(movimientoConfiable){
const diferencia=diferenciaAngular(rumboVisual,ubicacion.rumboSegmento)
return diferencia<=90
? {...base,codigo:"BAJADA_EST",texto:"Bajada est.",corto:"B",clase:"sentido-bajada"}
: {...base,codigo:"RETORNO_EST",texto:"Retorno est.",corto:"R",clase:"sentido-retorno"}
}

return {...base,codigo:"CALCULANDO",texto:"Calculando",corto:"...",clase:"sentido-detenido"}
}

function poblarSelectorRutas(){
filtroRuta.innerHTML = '<option value="">Todas las rutas</option>'
rutasGeometria.forEach(ruta=>{
const option=document.createElement("option")
option.value=String(ruta.id)
option.textContent=ruta.nombre
filtroRuta.appendChild(option)
})
}

function dibujarRutaReal(coords){
if(!coords || coords.length < 2) return

L.polyline(coords,{
color:"#000",
weight:16,
opacity:.7,
lineCap:"round",
lineJoin:"round"
}).addTo(capaRutas)

L.polyline(coords,{
color:"#e5e5e5",
weight:12,
opacity:.95,
lineCap:"round",
lineJoin:"round"
}).addTo(capaRutas)

L.polyline(coords,{
color:"#00e5ff",
weight:4,
dashArray:"10,10",
opacity:.9,
lineCap:"round",
lineJoin:"round"
}).addTo(capaRutas)

dibujarFlechasRuta(coords)
}

function renderizarRutas(){
capaRutas.clearLayers()

rutasGeometria
.filter(ruta=>Array.isArray(ruta.geometria) && ruta.geometria.length > 1)
.filter(ruta=>!rutaSeleccionada || String(ruta.id)===rutaSeleccionada)
.forEach(ruta=>{
dibujarRutaReal(ruta.geometria)
})
}

/* PUNTOS CONTROL */

fetch("/sistema/api/despachador/puntos-control/")
.then(r=>r.json())
.then(puntos=>{
puntosControlData=puntos
renderizarPuntosControl()
})

function renderizarPuntosControl(){
capaPuntosControl.clearLayers()

puntosControlData
.filter(p=>!rutaSeleccionada || String(p.ruta_id)===rutaSeleccionada)
.forEach(p=>{
const coord=[p.lat,p.lng]

const esMarcacion=Boolean(p.requiere_marcacion)

const radioColor=esMarcacion ? "#ffd54f" : "#60a5fa"
const puntoColor=esMarcacion ? "#ff9800" : "#2563eb"
const tooltipClass=esMarcacion ? "punto-control-label" : "punto-referencia-label"
const tooltipText=esMarcacion ? p.codigo : `${p.codigo} REF`

L.circle(coord,{
radius:p.radio||100,
color:radioColor,
fillColor:radioColor,
fillOpacity:esMarcacion ? .25 : .14,
dashArray:esMarcacion ? null : "6,6"
}).addTo(capaPuntosControl)

L.circleMarker(coord,{
radius:6,
color:puntoColor,
fillColor:puntoColor,
fillOpacity:1
})
.bindTooltip(tooltipText,{permanent:true,className:tooltipClass})
.bindPopup(`
<div style="min-width:180px">
<b>${p.nombre}</b><br>
<b>Codigo:</b> ${p.codigo}<br>
<b>Tipo:</b> ${esMarcacion ? "Marcacion" : "Referencia"}<br>
<b>Ruta:</b> ${p.ruta || "--"}<br>
<b>Radio:</b> ${p.radio || 0} m
</div>
`)
.addTo(capaPuntosControl)

})
}

/* ICONOS BUS */

const ICON_BUS={
ACTIVO:"{% static 'icons/bus_green.png' %}",
INACTIVO:"{% static 'icons/bus_yellow.png' %}",
OFFLINE:"{% static 'icons/bus_red.png' %}"
}

function obtenerEstadoVisual(v){
if(v.estado_gps==="OFFLINE"){
return "OFFLINE"
}

return v.estado==="ACTIVO" ? "ACTIVO" : "INACTIVO"
}

function escaparHtml(valor){
return String(valor ?? "").replace(/[&<>"']/g,caracter=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
"\"":"&quot;",
"'":"&#039;"
}[caracter]))
}

function obtenerMsSenal(v){
const valor=v.actualizado_en || v.fecha
if(!valor) return null
const ms=Date.parse(valor)
return Number.isFinite(ms) ? ms : null
}

function formatearHoraMapa(valor){
if(!valor) return "--"
const fecha=new Date(valor)
if(Number.isNaN(fecha.getTime())) return escaparHtml(valor)
return fecha.toLocaleTimeString("es-PE",{
hour:"2-digit",
minute:"2-digit",
second:"2-digit"
})
}

function calcularVelocidadVisual(v,markerAnterior=null){
const velocidadGps=Number(v.velocidad)

if(Number.isFinite(velocidadGps) && velocidadGps>1){
return {valor:Math.round(velocidadGps),fuente:"GPS"}
}

if(markerAnterior?.latUltima && markerAnterior?.lngUltima && v.lat && v.lng){
const posicionAnterior=[markerAnterior.latUltima,markerAnterior.lngUltima]
const posicionActual=[Number(v.lat),Number(v.lng)]
const distancia=distanciaMetrosEntre(posicionAnterior,posicionActual)
const msActual=obtenerMsSenal(v)
const msAnterior=markerAnterior.actualizadoMs
const segundos=msActual && msAnterior && msActual>msAnterior ? (msActual-msAnterior)/1000 : null

if(segundos && segundos>=3 && segundos<=180){
if(distancia<5){
return {valor:0,fuente:"Estimado"}
}

const calculada=(distancia/segundos)*3.6
if(Number.isFinite(calculada) && calculada>=1 && calculada<=120){
return {valor:Math.round(calculada),fuente:"Estimado"}
}
}
}

if(markerAnterior?.velocidadVisual!=null){
return {
valor:markerAnterior.velocidadVisual,
fuente:markerAnterior.velocidadFuente || "Estimado"
}
}

return {valor:0,fuente:Number.isFinite(velocidadGps) ? "GPS" : "--"}
}

function construirPopupBus(v,estadoVisual,sentido,velocidadInfo){
const ultimaSenal=formatearHoraMapa(v.actualizado_en || v.fecha)
const velocidad=Number.isFinite(Number(velocidadInfo?.valor)) ? Math.round(Number(velocidadInfo.valor)) : 0
const fuenteVelocidad=velocidadInfo?.fuente || "GPS"
const estadoGps=v.estado_gps || "--"
const rumbo=Number.isFinite(Number(sentido.rumboVisual)) ? Math.round(Number(sentido.rumboVisual)) : "--"
const estadoClase=estadoVisual.toLowerCase()
const vehiculo=escaparHtml(v.vehiculo || "--")
const placa=escaparHtml(v.placa || "Sin placa")
const ruta=escaparHtml(v.ruta_nombre || "Sin ruta asignada")
const estadoTexto=escaparHtml(estadoVisual)
const gpsTexto=escaparHtml(estadoGps)
const sentidoTexto=escaparHtml(sentido.texto)
const velocidadNota=fuenteVelocidad==="Estimado" ? "estimada por movimiento" : "reportada por GPS"
const recorridoUrl=`/sistema/despachador/recorrido/?vehiculo=${encodeURIComponent(v.vehiculo_id || "")}`

return `
<div class="bus-popup">
<div class="bus-popup-head">
<div>
<span class="bus-popup-kicker">Unidad</span>
<div class="bus-popup-title">${vehiculo}</div>
<div class="bus-popup-sub">${placa}</div>
</div>
<span class="bus-popup-badge ${estadoClase}">${estadoTexto}</span>
</div>
<div class="bus-popup-body">
<div class="bus-popup-route">${ruta}</div>
<div class="bus-popup-grid">
<div class="bus-popup-item">
<span class="bus-popup-label">Sentido</span>
<span class="bus-popup-value"><span class="sentido-chip ${sentido.clase}">${sentidoTexto}</span></span>
</div>
<div class="bus-popup-item">
<span class="bus-popup-label">GPS</span>
<span class="bus-popup-value">${gpsTexto}</span>
</div>
<div class="bus-popup-item">
<span class="bus-popup-label">Velocidad</span>
<span class="bus-popup-value">${velocidad} km/h</span>
<span class="bus-popup-note">${velocidadNota}</span>
</div>
<div class="bus-popup-item">
<span class="bus-popup-label">Rumbo</span>
<span class="bus-popup-value">${rumbo}&deg;</span>
</div>
<div class="bus-popup-item popup-wide">
<span class="bus-popup-label">Ultima senal</span>
<span class="bus-popup-value">${ultimaSenal}</span>
</div>
</div>
<a href="${recorridoUrl}" class="bus-popup-action">Ver recorrido</a>
</div>
</div>
`
}

function crearIconoBus(v,sentido){

let direccion=Number.isFinite(Number(sentido.rumboVisual)) ? Number(sentido.rumboVisual) : Number(v.direccion || 0)

let estado=obtenerEstadoVisual(v)
let vehiculo=v.vehiculo

let clase=
estado==="ACTIVO"?"bus-activo":
estado==="INACTIVO"?"bus-inactivo":
"bus-offline"

let live=estado==="ACTIVO"?`<span class="live-dot"></span>`:""
let indicadorSentido=sentido.codigo==="DESCONOCIDO" ? "" : `
<div class="bus-sentido-indicator ${sentido.clase}">
<span class="bus-sentido-arrow" style="transform:rotate(${direccion}deg)"></span>
<span>${sentido.corto}</span>
</div>
`

return L.divIcon({

className:"",

html:`
<div class="bus-marker ${clase}">
${live}
${indicadorSentido}
<div class="bus-numero">${vehiculo}</div>
<img src="${ICON_BUS[estado]}" style="transform:rotate(${direccion}deg)">
</div>
`,

iconSize:[52,52],
iconAnchor:[26,26]

})

}

function actualizarPanel(data){

listaBuses.innerHTML=""

data.filter(v=>coincideRutaSeleccionada(v)).forEach(v=>{

let estadoVisual=obtenerEstadoVisual(v)
let sentido=markers[v.vehiculo]?.sentidoInfo || detectarSentidoVehiculo(v,markers[v.vehiculo])

let color=
estadoVisual==="ACTIVO"?"status-activo":
estadoVisual==="INACTIVO"?"status-inactivo":
"status-offline"

let item=document.createElement("div")

item.className="bus-item"

item.innerHTML=`
<span class="bus-status ${color}"></span>
Bus ${v.vehiculo}
${v.placa ? `<span style="font-size:11px;opacity:.7">${v.placa}</span>` : ""}
<span class="sentido-chip ${sentido.clase}">${sentido.texto}</span>
<span style="margin-left:auto;font-size:11px;opacity:.7">${estadoVisual}</span>
`

item.onclick=()=>{

if(markers[v.vehiculo]){

map.setView(markers[v.vehiculo].getLatLng(),18,{
animate:true
})

markers[v.vehiculo].openPopup()

}

}

listaBuses.appendChild(item)

})

}

/* FILTROS */

const markers={}
const filtros={ACTIVO:true,INACTIVO:true,OFFLINE:true}

function coincideRutaSeleccionada(v){
if(!rutaSeleccionada) return true
return String(v.ruta_id || "")===rutaSeleccionada
}

window.toggleFiltro=e=>{
filtros[e]=!filtros[e]
aplicarFiltros()
}

window.cambiarRuta=()=>{
rutaSeleccionada=filtroRuta.value
renderizarRutas()
renderizarPuntosControl()
mapaCentrado=false
cargar()
}

window.aplicarFiltros=()=>{

const texto=document.getElementById("busqueda").value.toLowerCase()

Object.values(markers).forEach(m=>{

/* ANIMACION MOVIMIENTO BUS */

function animarMovimiento(marker,nuevaPos){

let actual=marker.getLatLng()

let latDiff=(nuevaPos[0]-actual.lat)/10
let lngDiff=(nuevaPos[1]-actual.lng)/10

let i=0

let anim=setInterval(()=>{

if(i>=10){
clearInterval(anim)
marker.setLatLng(nuevaPos)
return
}

actual.lat+=latDiff
actual.lng+=lngDiff

marker.setLatLng([actual.lat,actual.lng])

i++

},40)

}

/* GPS */

async function cargar(){
if(actualizando || document.hidden) return
actualizando=true

try{

const res=await fetch("/sistema/api/despachador/mapa/",{
cache:"no-store"
})
const data=await res.json()

const vehiculosPresentes=new Set(
data
.filter(v=>v.lat && v.lng)
.map(v=>String(v.vehiculo))
)

Object.keys(markers).forEach(codigo=>{
if(vehiculosPresentes.has(codigo)){
return
}

capaFlota.removeLayer(markers[codigo])
delete markers[codigo]
})

const dataFiltrada=data.filter(v=>coincideRutaSeleccionada(v))

let a=0,i=0,o=0
let bounds=[]

dataFiltrada.forEach(v=>{

if(!v.lat||!v.lng)return

bounds.push([v.lat,v.lng])

const estadoVisual=obtenerEstadoVisual(v)
const markerActual=markers[v.vehiculo]
const sentido=detectarSentidoVehiculo(v,markerActual)
const velocidadInfo=calcularVelocidadVisual(v,markerActual)

if(estadoVisual==="ACTIVO")a++
else if(estadoVisual==="INACTIVO")i++
else o++

const icono=crearIconoBus(v,sentido)
const popupHtml=construirPopupBus(v,estadoVisual,sentido,velocidadInfo)

if(!markers[v.vehiculo]){

const m=L.marker([v.lat,v.lng],{icon:icono})
.bindPopup(popupHtml,{className:"bus-popup-leaflet"})
.addTo(capaFlota)

m.estado=estadoVisual
m.codigo=String(v.vehiculo).toLowerCase()
m.placa=(v.placa || "").toLowerCase()
m.busqueda=`${m.codigo} ${m.placa}`.trim()
m.rutaId=String(v.ruta_id || "")
m.sentido=sentido.codigo
m.sentidoInfo=sentido
m.latUltima=Number(v.lat)
m.lngUltima=Number(v.lng)
m.actualizadoMs=obtenerMsSenal(v) || Date.now()
m.velocidadVisual=velocidadInfo.valor
m.velocidadFuente=velocidadInfo.fuente
m.progresoRuta=sentido.progresoRuta
m.rutaDeteccion=sentido.rutaDeteccion
m.rumboVisual=sentido.rumboVisual

markers[v.vehiculo]=m

}else{

animarMovimiento(markers[v.vehiculo],[v.lat,v.lng])
markers[v.vehiculo].setIcon(icono)
markers[v.vehiculo].setPopupContent(popupHtml)
markers[v.vehiculo].estado=estadoVisual
markers[v.vehiculo].codigo=String(v.vehiculo).toLowerCase()
markers[v.vehiculo].placa=(v.placa || "").toLowerCase()
markers[v.vehiculo].busqueda=`${markers[v.vehiculo].codigo} ${markers[v.vehiculo].placa}`.trim()
markers[v.vehiculo].rutaId=String(v.ruta_id || "")
markers[v.vehiculo].sentido=sentido.codigo
markers[v.vehiculo].sentidoInfo=sentido
markers[v.vehiculo].latUltima=Number(v.lat)
markers[v.vehiculo].lngUltima=Number(v.lng)
markers[v.vehiculo].actualizadoMs=obtenerMsSenal(v) || markers[v.vehiculo].actualizadoMs || Date.now()
markers[v.vehiculo].velocidadVisual=velocidadInfo.valor
markers[v.vehiculo].velocidadFuente=velocidadInfo.fuente
markers[v.vehiculo].progresoRuta=sentido.progresoRuta
markers[v.vehiculo].rutaDeteccion=sentido.rutaDeteccion
markers[v.vehiculo].rumboVisual=sentido.rumboVisual

}

})

actualizarPanel(dataFiltrada)

document.getElementById("cnt-activo").innerText=a
document.getElementById("cnt-inactivo").innerText=i
document.getElementById("cnt-offline").innerText=o
document.getElementById("cnt-total").innerText=data.length

aplicarFiltros()

if(bounds.length>0 && !mapaCentrado){
map.fitBounds(bounds,{padding:[40,40]})
mapaCentrado=true
}

}catch(error){
console.error("Error cargando mapa:",error)
}finally{
actualizando=false
}

}

poblarSelectorRutas()
renderizarRutas()
cargar()

function iniciarPollingMapa(){
if(mapaTimer){
clearInterval(mapaTimer)
}

mapaTimer=setInterval(cargar,POLL_INTERVAL_MS)
}

document.addEventListener("visibilitychange",()=>{
if(document.hidden){
return
}

cargar()
})

iniciarPollingMapa()

window.addEventListener("resize",()=>{
requestAnimationFrame(()=>{
map.invalidateSize(true)
})
})

map.whenReady(()=>{
setTimeout(()=>{
map.invalidateSize(true)
},150)
})

})

</script>
