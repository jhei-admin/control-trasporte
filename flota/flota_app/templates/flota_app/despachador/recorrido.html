{% extends "flota_app/base.html" %}
{% block title %}Historial de Recorrido{% endblock %}
{% block content %}

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
  .leaflet-container {
    background: #0f172a;
  }

  .recorrido-shell {
    background: #0f172a;
    border-radius: 12px;
    padding: 14px;
    box-shadow: 0 10px 24px rgba(15, 23, 42, 0.18);
  }

  .recorrido-head {
    color: #e5eefc;
    margin-bottom: 12px;
  }

  .recorrido-sub {
    font-size: 13px;
    color: #a8bddf;
    margin-top: 4px;
  }

  .recorrido-panel {
    margin-bottom: 12px;
  }

  .recorrido-panel label {
    color: #dbeafe;
    font-weight: 600;
    margin-bottom: 6px;
  }

  #map {
    height: 500px;
    width: 100%;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid rgba(148, 163, 184, 0.16);
  }

  .leaflet-popup-content-wrapper,
  .leaflet-popup-tip {
    background: #111827;
    color: #f8fafc;
  }
</style>

<h2 class="mb-3">Historial de Recorrido</h2>
<hr>

<div class="recorrido-shell">
  <div class="recorrido-head">
    <div class="fw-bold">Detalle del recorrido y paradas</div>
    <div class="recorrido-sub">
      Esta vista sirve para revisar el trayecto GPS de una unidad en una fecha especifica.
    </div>
  </div>

  <div class="row recorrido-panel">
    <div class="col-md-4">
      <label>Vehiculo</label>
      <select id="vehiculo" class="form-select">
        {% for v in vehiculos %}
          <option
            value="{{ v.id }}"
            {% if vehiculo_preseleccionado == v.id|stringformat:"s" %}selected{% endif %}
          >{{ v.numero }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="col-md-4">
      <label>Fecha</label>
      <input type="date" id="fecha" class="form-control">
    </div>

    <div class="col-md-4 d-flex align-items-end">
      <button
        class="btn btn-primary w-100"
        id="btn-recorrido"
        onclick="cargarRecorrido()"
      >
        Ver recorrido
      </button>
    </div>
  </div>

  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  const MAP_CENTER = [-16.338088, -71.619947];
  const map = L.map("map").setView(MAP_CENTER, 13);

  L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
    attribution: "&copy; OpenStreetMap contributors &copy; CARTO"
  }).addTo(map);

  let polyline = null;
  let puntos = [];
  let paradasMarkers = [];

  const paradaIcon = L.icon({
    iconUrl: "/static/img/parada_amarilla.svg",
    iconSize: [26, 26],
    iconAnchor: [13, 26],
    popupAnchor: [0, -26],
  });

  function limpiarMapa() {
    if (polyline) {
      map.removeLayer(polyline);
      polyline = null;
    }

    puntos.forEach((punto) => map.removeLayer(punto));
    puntos = [];

    paradasMarkers.forEach((marker) => map.removeLayer(marker));
    paradasMarkers = [];
  }

  function mensajeSinRecorrido(texto) {
    limpiarMapa();
    map.setView(MAP_CENTER, 13);
    alert(texto);
  }

  async function cargarRecorrido() {
    const vehiculo = document.getElementById("vehiculo").value;
    const fecha = document.getElementById("fecha").value;
    const btn = document.getElementById("btn-recorrido");

    if (!vehiculo || !fecha) {
      alert("Selecciona vehiculo y fecha");
      return;
    }

    btn.disabled = true;
    btn.innerText = "Cargando...";

    limpiarMapa();

    try {
      const res = await fetch(
        `/sistema/api/despachador/recorrido/?vehiculo=${vehiculo}&fecha=${fecha}`
      );

      if (!res.ok) {
        let detalle = "Error consultando recorrido";
        try {
          const errorData = await res.json();
          if (errorData && errorData.error) {
            detalle = errorData.error;
          }
        } catch (_) {}
        throw new Error(detalle);
      }

      const data = await res.json();

      if (!Array.isArray(data) || !data.length) {
        mensajeSinRecorrido("No hay registros GPS para ese dia");
        return;
      }

      const coords = [];

      data.forEach((punto) => {
        const lat = Number(punto.lat);
        const lng = Number(punto.lng);

        if (!Number.isFinite(lat) || !Number.isFinite(lng)) {
          return;
        }

        coords.push([lat, lng]);

        const marker = L.circleMarker([lat, lng], {
          radius: 4,
          color: "#8be9fd",
          weight: 1,
          fillColor: "#8be9fd",
          fillOpacity: 0.85
        })
          .bindPopup(`
            <strong>Hora:</strong> ${punto.hora}<br>
            <strong>Velocidad:</strong> ${punto.velocidad} km/h<br>
            <small>${lat.toFixed(5)}, ${lng.toFixed(5)}</small>
          `)
          .addTo(map);

        puntos.push(marker);
      });

      if (!coords.length) {
        mensajeSinRecorrido("No hay registros GPS validos para ese dia");
        return;
      }

      if (coords.length === 1) {
        map.setView(coords[0], 16);
      } else {
        polyline = L.polyline(coords, {
          color: "#ffffff",
          weight: 4,
          opacity: 0.95
        }).addTo(map);

        map.fitBounds(polyline.getBounds(), {
          padding: [40, 40]
        });
      }

      await cargarParadas(vehiculo, fecha);
    } catch (err) {
      console.error(err);
      mensajeSinRecorrido(err.message || "Error cargando el recorrido");
    } finally {
      btn.disabled = false;
      btn.innerText = "Ver recorrido";
    }
  }

  async function cargarParadas(vehiculo, fecha) {
    try {
      const res = await fetch(
        `/sistema/api/despachador/paradas/?vehiculo=${vehiculo}&fecha=${fecha}`
      );

      if (!res.ok) {
        return;
      }

      const paradas = await res.json();
      if (!Array.isArray(paradas)) {
        return;
      }

      paradas.forEach((parada) => {
        const lat = Number(parada.lat);
        const lng = Number(parada.lng);

        if (!Number.isFinite(lat) || !Number.isFinite(lng)) {
          return;
        }

        const marker = L.marker([lat, lng], { icon: paradaIcon })
          .addTo(map)
          .bindPopup(`
            <b>Parada</b><br>
            <strong>Inicio:</strong> ${parada.inicio}<br>
            <strong>Fin:</strong> ${parada.fin || "Activa"}<br>
            <strong>Duracion:</strong> ${parada.duracion_min} min
          `);

        paradasMarkers.push(marker);
      });
    } catch (err) {
      console.error("Error cargando paradas", err);
    }
  }

  document.addEventListener("DOMContentLoaded", () => {
    const fechaInicial = "{{ fecha_preseleccionada|default:'' }}";
    const hoy = new Date().toISOString().slice(0, 10);
    const fechaInput = document.getElementById("fecha");

    fechaInput.value = fechaInicial || hoy;

    if (document.getElementById("vehiculo").value && fechaInput.value) {
      cargarRecorrido();
    }
  });
</script>

{% endblock %}
