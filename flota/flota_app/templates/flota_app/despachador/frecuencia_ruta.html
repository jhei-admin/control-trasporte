{% extends "flota_app/base.html" %}

{% block content %}

<h2>CONTROL DE FRECUENCIA</h2>

<div style="margin-bottom: 15px;">
    <a href="{% url 'panel_despachador' %}" class="btn btn-secondary">
        &larr; Volver al Panel
    </a>
</div>

<div style="margin-bottom: 15px; display:flex; gap:10px; max-width: 520px;">
    <select id="rutaFrecuencia" class="form-select">
        <option value="">Seleccionar ruta</option>
        {% for ruta in rutas %}
        <option value="{{ ruta.id }}" {% if ruta_actual_id == ruta.id|stringformat:"s" %}selected{% endif %}>
            {{ ruta.nombre }}
        </option>
        {% endfor %}
    </select>
    <input id="fechaFrecuencia" class="form-control" type="date">
</div>

<div style="overflow-x:auto">

<table class="table table-bordered text-center">

<thead class="table-dark">
<tr>

<th>Unidad</th>
<th>Hora</th>

{% for p in puntos %}
<th>{{ p.codigo }}</th>
{% endfor %}

<th>Freq</th>
<th>Estado</th>

</tr>
</thead>

<tbody id="bodyFrecuencia">

<tr>
<td colspan="{{ puntos|length|add:4 }}" class="text-muted">
Cargando datos...
</td>
</tr>

</tbody>

</table>

</div>


<script>

const POLL_INTERVAL_MS = 8000
let frecuenciaTimer = null
let frecuenciaCargando = false
const rutaSelect = document.getElementById("rutaFrecuencia")
const fechaInput = document.getElementById("fechaFrecuencia")

function fechaLocalISO(){
    const ahora = new Date()
    const offsetMs = ahora.getTimezoneOffset() * 60000
    return new Date(ahora.getTime() - offsetMs).toISOString().slice(0, 10)
}

if(fechaInput && !fechaInput.value){
    const params = new URLSearchParams(window.location.search)
    fechaInput.value = params.get("fecha") || fechaLocalISO()
}

function obtenerRutaActual(){
    return rutaSelect ? rutaSelect.value : ""
}

function obtenerFechaActual(){
    return fechaInput ? fechaInput.value : ""
}

async function actualizarFrecuencia(){
    if(frecuenciaCargando || document.hidden){
        return
    }

    frecuenciaCargando = true

    try{
        const ruta = obtenerRutaActual()
        const fecha = obtenerFechaActual()
        const body = document.getElementById("bodyFrecuencia")

        if(!ruta){
            body.innerHTML = `
            <tr>
                <td colspan="22" class="text-muted">
                Seleccione una ruta para ver la frecuencia
                </td>
            </tr>`
            return
        }

        const params = new URLSearchParams({ruta})
        if(fecha){
            params.set("fecha", fecha)
        }

        const res = await fetch(`/sistema/api/frecuencia/?${params.toString()}`, {
            cache: "no-store"
        })

        if(!res.ok){
            throw new Error("API no responde")
        }

        const json = await res.json()

        body.innerHTML = ""

        if(!json.data || json.data.length === 0){

            body.innerHTML = `
            <tr>
                <td colspan="22" class="text-muted">
                No hay salidas registradas
                </td>
            </tr>`
            return
        }

        json.data.forEach((fila,index)=>{

            let claseFila=""

            if(fila.hueco){
                claseFila="table-warning"
            }

            if(fila.pegado){
                claseFila="table-danger"
            }

            if(fila.finalizada){
                claseFila="table-secondary"
            }

            let tr = `<tr class="${claseFila}">`

            tr += `<td class="fw-bold">${fila.unidad}</td>`
            tr += `<td>${fila.hora || "-"}</td>`

            fila.controles.forEach(v=>{

                let clase=""
                let valor="N"

                if(v !== null && v !== undefined){

                    valor = v

                    if(typeof v === "number"){

                        if(v > 0) clase="bg-danger text-white"
                        if(v < 0) clase="bg-info text-dark"
                        if(v === 0) clase="bg-success text-white"

                    }

                }

                tr += `<td class="${clase}">${valor}</td>`

            })

            let freq=""

            if(index === 0){
                freq="Inicio"
            }else{
                freq = fila.frecuencia ? fila.frecuencia + " min" : "-"
            }

            tr += `<td><b>${freq}</b></td>`

            let estado = "-"
            if(fila.estado === "finalizada") estado = "Finalizada"
            if(fila.estado === "en_ruta") estado = "En ruta"
            if(fila.estado === "en_cola") estado = "En cola"
            if(fila.estado === "cerrada") estado = "Cerrada"

            tr += `<td><b>${estado}</b></td>`

            tr += "</tr>"

            body.innerHTML += tr

        })

    }catch(e){

        console.error("Error actualizando frecuencia:", e)

    }finally{

        frecuenciaCargando = false

    }

}

function iniciarPollingFrecuencia(){
    if(frecuenciaTimer){
        clearInterval(frecuenciaTimer)
    }

    frecuenciaTimer = setInterval(actualizarFrecuencia, POLL_INTERVAL_MS)
}

document.addEventListener("visibilitychange", ()=>{
    if(document.hidden){
        return
    }

    actualizarFrecuencia()
})

if(rutaSelect){
    rutaSelect.addEventListener("change", ()=>{
        const url = new URL(window.location.href)

        if(rutaSelect.value){
            url.searchParams.set("ruta", rutaSelect.value)
        }else{
            url.searchParams.delete("ruta")
        }

        window.history.replaceState({}, "", url)
        actualizarFrecuencia()
    })
}

if(fechaInput){
    fechaInput.addEventListener("change", ()=>{
        const url = new URL(window.location.href)

        if(fechaInput.value){
            url.searchParams.set("fecha", fechaInput.value)
        }else{
            url.searchParams.delete("fecha")
        }

        window.history.replaceState({}, "", url)
        actualizarFrecuencia()
    })
}

actualizarFrecuencia()
iniciarPollingFrecuencia()

</script>

{% endblock %}
