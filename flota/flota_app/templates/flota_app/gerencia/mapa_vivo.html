{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GPS Tracking AQP | Mapa vivo</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0f172a;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
}

#map {
    position: fixed;
    inset: 0;
    background: #0f172a;
    z-index: 1;
}

.leaflet-container {
    background: #0f172a;
}

.top-shell {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 12px 0;
    pointer-events: none;
}

.toolbar-card {
    background: rgba(255, 255, 255, 0.92);
    color: #0f172a;
    border-radius: 18px;
    border: 1px solid rgba(15, 23, 42, 0.06);
    backdrop-filter: blur(10px);
    box-shadow: 0 12px 28px rgba(15, 23, 42, 0.18);
    padding: 10px;
    pointer-events: auto;
}

.toolbar-row {
    display: flex;
    align-items: center;
    gap: 8px;
}

.search-box {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    background: #fff;
    border: 1px solid rgba(148, 163, 184, 0.35);
    border-radius: 14px;
    padding: 10px 12px;
}

.search-box svg {
    width: 18px;
    height: 18px;
    color: #64748b;
}

.search-box input {
    flex: 1;
    border: 0;
    outline: none;
    background: transparent;
    color: #0f172a;
    font-size: 15px;
}

.icon-btn {
    border: 0;
    width: 44px;
    height: 44px;
    border-radius: 14px;
    background: #fff;
    color: #0f172a;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 20px rgba(15, 23, 42, 0.12);
}

.search-results {
    margin-top: 8px;
    display: none;
    max-height: 230px;
    overflow-y: auto;
    background: rgba(255,255,255,.98);
    border-radius: 16px;
    box-shadow: 0 12px 28px rgba(15, 23, 42, 0.16);
}

.search-results.visible {
    display: block;
}

.result-item {
    padding: 12px 14px;
    border-bottom: 1px solid rgba(148, 163, 184, 0.16);
    cursor: pointer;
}

.result-item:last-child {
    border-bottom: 0;
}

.result-item strong {
    display: block;
    font-size: 14px;
}

.result-item small {
    display: block;
    color: #64748b;
    margin-top: 2px;
}

.floating-badges {
    position: fixed;
    left: 12px;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
    z-index: 1000;
    display: flex;
    gap: 8px;
    pointer-events: none;
}

.mini-pill {
    background: rgba(15, 23, 42, 0.78);
    color: #fff;
    border-radius: 999px;
    padding: 8px 12px;
    font-size: 12px;
    font-weight: 700;
    backdrop-filter: blur(8px);
}

.leaflet-tooltip.paradero-label,
.punto-control-label {
    border: none;
    border-radius: 7px;
    padding: 4px 7px;
    font-size: 11px;
    font-weight: 700;
    background: rgba(15, 23, 42, .92);
    color: #fff;
}

.bus-marker {
    position: relative;
    width: 34px;
    height: 34px;
}

.bus-numero {
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,.82);
    color: #fff;
    font-size: 11px;
    padding: 1px 6px;
    border-radius: 6px;
}

.bus-marker img {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 3px 4px rgba(0,0,0,.6));
}

.bus-activo {
    filter: drop-shadow(0 0 6px rgba(40,167,69,.9));
}

.bus-offline {
    opacity: .45;
    filter: grayscale(80%);
}

.live-dot {
    position: absolute;
    top: -18px;
    right: -6px;
    width: 8px;
    height: 8px;
    background: #28a745;
    border-radius: 50%;
    animation: livePulse 1.5s infinite;
}

@keyframes livePulse {
    0% { box-shadow: 0 0 0 0 rgba(40,167,69,.7); }
    70% { box-shadow: 0 0 0 8px rgba(40,167,69,0); }
    100% { box-shadow: 0 0 0 0 rgba(40,167,69,0); }
}

.debug-badge {
    position: fixed;
    right: 12px;
    top: calc(env(safe-area-inset-top, 0px) + 74px);
    z-index: 1200;
    max-width: 220px;
    background: rgba(0, 0, 0, .82);
    color: #fff;
    border-radius: 12px;
    padding: 8px 10px;
    font-size: 11px;
    line-height: 1.35;
    box-shadow: 0 10px 24px rgba(0,0,0,.22);
}
</style>
</head>
<body>
<div id="map"></div>
<div id="debug-badge" class="debug-badge">Iniciando mapa...</div>

<div class="top-shell">
    <div class="toolbar-card">
        <div class="toolbar-row">
            <div class="search-box">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="7"></circle>
                    <path d="m20 20-3.5-3.5"></path>
                </svg>
                <input id="busqueda-unidad" type="text" placeholder="Buscar unidad o placa">
            </div>
            <button class="icon-btn" type="button" onclick="centrarMapa()" aria-label="Centrar mapa">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M12 2v3"></path>
                    <path d="M12 19v3"></path>
                    <path d="M2 12h3"></path>
                    <path d="M19 12h3"></path>
                </svg>
            </button>
        </div>
        <div id="search-results" class="search-results"></div>
    </div>
</div>

<div class="floating-badges">
    <div class="mini-pill"><span id="cnt-online">0</span> online</div>
    <div class="mini-pill"><span id="cnt-total">0</span> total</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const debugBadge = document.getElementById("debug-badge");
function debugMap(message) {
    console.log("[MAPA_GERENCIA]", message);
    if (debugBadge) {
        debugBadge.textContent = message;
    }
}

window.addEventListener("error", (event) => {
    debugMap(`JS error: ${event.message}`);
});

const STAFF_TOKEN = "{{ staff_token|escapejs }}";
const PARADERO = [-16.338088, -71.619947];
const ZOOM_PARADERO = 15;
const rutasGeometria = {{ rutas_json|safe }};
const initialSelectedVehiculoId = new URLSearchParams(window.location.search).get("vehiculo_id");
const searchInput = document.getElementById("busqueda-unidad");
const searchResults = document.getElementById("search-results");
const ICON_BUS = {
    ACTIVO: "{% static 'icons/bus_green.png' %}",
    INACTIVO: "{% static 'icons/bus_yellow.png' %}",
    OFFLINE: "{% static 'icons/bus_red.png' %}"
};

const mapElement = document.getElementById("map");
mapElement.style.height = `${window.innerHeight}px`;

const map = L.map("map", {
    zoomAnimation: true,
    fadeAnimation: false,
    markerZoomAnimation: true
}).setView(PARADERO, ZOOM_PARADERO);

const mapboxLayer = L.tileLayer(
    "https://api.mapbox.com/styles/v1/mapbox/navigation-night-v1/tiles/{z}/{x}/{y}?access_token={{ MAPBOX_TOKEN }}",
    {
        tileSize: 512,
        zoomOffset: -1,
        maxZoom: 20,
        keepBuffer: 6,
        updateWhenZooming: true,
        updateWhenIdle: false,
        attribution: "© Mapbox © OpenStreetMap"
    }
).addTo(map);

let fallbackApplied = false;
let tileErrorCount = 0;
let mapaCentrado = false;
let initialFocusApplied = false;
let ultimaDataUnidades = [];
const markers = {};

mapboxLayer.on("load", () => {
    debugMap("Mapa base cargado");
    setTimeout(() => {
        if (debugBadge) {
            debugBadge.style.display = "none";
        }
    }, 1600);
});

mapboxLayer.on("tileerror", () => {
    tileErrorCount += 1;
    debugMap(`Error cargando tiles (${tileErrorCount})`);
    if (fallbackApplied || tileErrorCount < 4) {
        return;
    }
    fallbackApplied = true;
    map.removeLayer(mapboxLayer);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "© OpenStreetMap"
    }).addTo(map);
    debugMap("Usando mapa alternativo");
});

map.zoomControl.setPosition("bottomright");
map.attributionControl.setPrefix(false);

const capaFlota = L.layerGroup().addTo(map);
const capaParadero = L.layerGroup().addTo(map);
const capaRutas = L.layerGroup().addTo(map);
const capaPuntosControl = L.layerGroup().addTo(map);

const paraderoIcon = L.icon({
    iconUrl: "{% static 'icons/paradero.png' %}",
    iconSize: [36, 36],
    iconAnchor: [18, 36]
});

L.marker(PARADERO, { icon: paraderoIcon })
    .bindTooltip("Paradero", { permanent: true, className: "paradero-label" })
    .addTo(capaParadero);

function dibujarRutaReal(coords) {
    if (!coords || coords.length < 2) return;
    L.polyline(coords, {
        color: "#000",
        weight: 16,
        opacity: .7,
        lineCap: "round",
        lineJoin: "round"
    }).addTo(capaRutas);
    L.polyline(coords, {
        color: "#e5e5e5",
        weight: 12,
        opacity: .95,
        lineCap: "round",
        lineJoin: "round"
    }).addTo(capaRutas);
    L.polyline(coords, {
        color: "#00e5ff",
        weight: 4,
        dashArray: "10,10",
        opacity: .9,
        lineCap: "round",
        lineJoin: "round"
    }).addTo(capaRutas);
}

function renderizarRutasYPuntos() {
    capaRutas.clearLayers();
    capaPuntosControl.clearLayers();
    rutasGeometria.forEach(ruta => {
        dibujarRutaReal(ruta.geometria);
        (ruta.puntos || []).forEach(p => {
            const coord = [p.lat, p.lng];
            L.circle(coord, {
                radius: p.radio || 100,
                color: "#ffd54f",
                fillColor: "#ffd54f",
                fillOpacity: .18
            }).addTo(capaPuntosControl);
            L.circleMarker(coord, {
                radius: 6,
                color: "#ff9800",
                fillColor: "#ff9800",
                fillOpacity: 1
            }).bindTooltip(p.codigo, {
                permanent: true,
                className: "punto-control-label"
            }).addTo(capaPuntosControl);
        });
    });
}

function obtenerEstadoVisual(v) {
    if (v.estado_gps === "OFFLINE") return "OFFLINE";
    return v.estado === "ACTIVO" ? "ACTIVO" : "INACTIVO";
}

function crearIconoBus(v) {
    const estado = obtenerEstadoVisual(v);
    const clase = estado === "ACTIVO" ? "bus-activo" : (estado === "OFFLINE" ? "bus-offline" : "");
    const live = estado === "ACTIVO" ? '<span class="live-dot"></span>' : "";
    const direccion = v.direccion || 0;
    return L.divIcon({
        className: "",
        html: `
            <div class="bus-marker ${clase}">
                ${live}
                <div class="bus-numero">${v.vehiculo}</div>
                <img src="${ICON_BUS[estado]}" style="transform: rotate(${direccion}deg)">
            </div>
        `,
        iconSize: [34, 34],
        iconAnchor: [17, 17]
    });
}

function popupBus(v, estadoVisual) {
    return `
        <div style="min-width:180px">
            <b>Unidad:</b> ${v.vehiculo}<br>
            <b>Estado:</b> ${estadoVisual}<br>
            <b>GPS:</b> ${v.estado_gps || "--"}<br>
            <b>Velocidad:</b> ${v.velocidad || 0} km/h<br>
            <b>Ruta:</b> ${v.ruta_nombre || "--"}<br>
            <b>Ultima senal:</b> ${v.actualizado_en || "--"}
        </div>
    `;
}

function animarMovimiento(marker, nuevaPos) {
    let actual = marker.getLatLng();
    const latDiff = (nuevaPos[0] - actual.lat) / 10;
    const lngDiff = (nuevaPos[1] - actual.lng) / 10;
    let i = 0;
    const anim = setInterval(() => {
        if (i >= 10) {
            clearInterval(anim);
            marker.setLatLng(nuevaPos);
            return;
        }
        actual.lat += latDiff;
        actual.lng += lngDiff;
        marker.setLatLng([actual.lat, actual.lng]);
        i++;
    }, 40);
}

function abrirUnidad(unidad) {
    const marker = markers[unidad.vehiculo];
    if (!marker) return;
    map.setView(marker.getLatLng(), 18, { animate: true });
    marker.openPopup();
    searchResults.classList.remove("visible");
    searchInput.blur();
}

function renderSearchResults(unidades) {
    const texto = (searchInput.value || "").trim().toLowerCase();
    if (!texto) {
        searchResults.innerHTML = "";
        searchResults.classList.remove("visible");
        return;
    }
    const filtradas = unidades
        .filter(v => `${String(v.vehiculo).toLowerCase()} ${(v.placa || "").toLowerCase()}`.includes(texto))
        .slice(0, 8);
    if (!filtradas.length) {
        searchResults.innerHTML = '<div class="result-item"><strong>Sin resultados</strong><small>Prueba con otro codigo o placa</small></div>';
        searchResults.classList.add("visible");
        return;
    }
    searchResults.innerHTML = filtradas.map(v => `
        <div class="result-item" data-vehiculo="${v.vehiculo}">
            <strong>Unidad ${v.vehiculo}</strong>
            <small>${v.placa || "--"} | ${v.ruta_nombre || "Sin ruta activa"}</small>
        </div>
    `).join("");
    searchResults.classList.add("visible");
    searchResults.querySelectorAll(".result-item[data-vehiculo]").forEach(item => {
        item.addEventListener("click", () => {
            const unidad = unidades.find(v => String(v.vehiculo) === item.dataset.vehiculo);
            if (unidad) {
                abrirUnidad(unidad);
            }
        });
    });
}

function centrarMapa() {
    map.setView(PARADERO, ZOOM_PARADERO);
}

async function cargarMapaVivo() {
    try {
        const res = await fetch(`/sistema/api/app/gerencia/mapa/?token=${encodeURIComponent(STAFF_TOKEN)}`, {
            cache: "no-store"
        });
        const data = await res.json();
        if (!data.ok) {
            console.error("Mapa gerencial sin datos", data);
            return;
        }

        const unidades = data.unidades || [];
        const bounds = [];

        Object.keys(markers).forEach(codigo => {
            const presente = unidades.some(v => String(v.vehiculo) === codigo && v.lat && v.lng);
            if (!presente) {
                capaFlota.removeLayer(markers[codigo]);
                delete markers[codigo];
            }
        });

        let online = 0;

        unidades.forEach(v => {
            if (!v.lat || !v.lng) return;
            const estado = obtenerEstadoVisual(v);
            if (estado === "ACTIVO") online++;
            bounds.push([v.lat, v.lng]);
            const icono = crearIconoBus(v);
            const html = popupBus(v, estado);

            if (!markers[v.vehiculo]) {
                markers[v.vehiculo] = L.marker([v.lat, v.lng], { icon: icono })
                    .bindPopup(html)
                    .addTo(capaFlota);
            } else {
                animarMovimiento(markers[v.vehiculo], [v.lat, v.lng]);
                markers[v.vehiculo].setIcon(icono);
                markers[v.vehiculo].setPopupContent(html);
            }
        });

        ultimaDataUnidades = unidades;
        document.getElementById("cnt-online").innerText = online;
        document.getElementById("cnt-total").innerText = unidades.length;
        renderSearchResults(unidades);

        if (bounds.length > 0 && !mapaCentrado) {
            map.fitBounds(bounds, { padding: [40, 40] });
            mapaCentrado = true;
        }

        if (initialSelectedVehiculoId && !initialFocusApplied) {
            const unidadInicial = unidades.find(v => String(v.vehiculo_id) === String(initialSelectedVehiculoId));
            if (unidadInicial) {
                initialFocusApplied = true;
                abrirUnidad(unidadInicial);
            }
        }
    } catch (error) {
        console.error("Error cargando mapa gerencial", error);
    }
}

searchInput.addEventListener("input", () => renderSearchResults(ultimaDataUnidades));
searchInput.addEventListener("focus", () => renderSearchResults(ultimaDataUnidades));
document.addEventListener("click", (event) => {
    if (!event.target.closest(".toolbar-card")) {
        searchResults.classList.remove("visible");
    }
});

renderizarRutasYPuntos();
cargarMapaVivo();
setInterval(cargarMapaVivo, 8000);

map.whenReady(() => {
    debugMap("Mapa listo");
    setTimeout(() => {
        mapElement.style.height = `${window.innerHeight}px`;
        map.invalidateSize(true);
    }, 250);
    setTimeout(() => {
        mapElement.style.height = `${window.innerHeight}px`;
        map.invalidateSize(true);
    }, 900);
});

window.addEventListener("resize", () => {
    mapElement.style.height = `${window.innerHeight}px`;
    map.invalidateSize(true);
});
</script>
</body>
</html>
