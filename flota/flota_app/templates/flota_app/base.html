{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>{% block title %}Sistema de Despacho{% endblock %}</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

/* FONDO */

body{
background:#f1f5f9;
font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
}

/* TARJETAS */

.card-panel{
background:white;
padding:18px;
border-radius:10px;
box-shadow:0 3px 10px rgba(0,0,0,0.06);
}

/* DASHBOARD */

.dashboard{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:14px;
margin-bottom:20px;
}

.stat-card{
background:white;
border-radius:10px;
padding:16px;
box-shadow:0 3px 10px rgba(0,0,0,0.08);
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
transition:all .2s ease;
}

.stat-card:hover{
transform:translateY(-4px);
box-shadow:0 6px 14px rgba(0,0,0,0.12);
}

.stat-num{
font-size:26px;
font-weight:700;
}

.stat-label{
font-size:13px;
color:#555;
}

.stat-green{border-top:4px solid #22c55e;}
.stat-blue{border-top:4px solid #0ea5e9;}
.stat-red{border-top:4px solid #ef4444;}
.stat-gray{border-top:4px solid #64748b;}

/* TABLA */

.table-modern{
border-collapse:separate;
border-spacing:0 10px;
}

.table-modern thead th{
border:none !important;
}

.table-modern tbody tr{
background:white;
box-shadow:0 3px 10px rgba(0,0,0,0.08);
border-radius:10px;
transition:all .15s ease;
}

.table-modern tbody td{
border:none !important;
padding:12px;
}

.table-modern tbody tr:hover{
background:#f8fafc;
transform:scale(1.01);
}

/* FILA LIDER */

.proxima{
background:#ecfdf5 !important;
border-left:4px solid #22c55e;
}

/* BADGES */

.badge-programado{
background:#0ea5e9;
color:white;
font-weight:600;
padding:6px 12px;
border-radius:6px;
}

.badge-atrasado{
background:#ef4444;
color:white;
font-weight:600;
padding:6px 12px;
border-radius:6px;
}

.badge-sinhora{
background:#64748b;
color:white;
font-weight:600;
padding:6px 12px;
border-radius:6px;
}

/* BOTONES */

.btn-icon{
padding:5px 9px;
font-size:14px;
line-height:1;
min-width:34px;
display:inline-flex;
align-items:center;
justify-content:center;
}

/* TOOLBAR */

.toolbar{
display:flex;
flex-wrap:wrap;
gap:8px;
margin-bottom:14px;
}

/* EFECTOS */

button,.btn{
transition:all .15s ease;
}

button:hover,.btn:hover{
transform:translateY(-1px);
}

input.form-control{
border-radius:6px;
}

h2{
font-weight:700;
}

/* HORA SISTEMA */

.hora-sistema{
font-weight:700;
font-size:24px;
color:#1f2937;
}

.table-dark th{
background:#1f2937 !important;
}

</style>

</head>

<body>

<div class="container mt-4">

{% block header %}{% endblock %}

{% if messages %}
<div class="mt-3">
{% for message in messages %}
<div class="alert alert-{{ message.tags }} alert-dismissible fade show">
{{ message }}
<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>
{% endfor %}
</div>
{% endif %}

{% block content %}{% endblock %}

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

{% block extra_js %}{% endblock %}

<script>

/*
CONTROL DE SESIÓN PROFESIONAL

Cerrar pestaña → logout
Cerrar navegador → logout
Recargar página → mantiene sesión
*/

let recargando = false;

// Detectar recarga
window.addEventListener("beforeunload", function () {
    if (!recargando) {
        navigator.sendBeacon("/logout/");
    }
});

// Detectar recarga real
window.addEventListener("keydown", function(e){
    if (e.key === "F5" || (e.ctrlKey && e.key === "r")) {
        recargando = true;
    }
});

// Detectar botón de recargar navegador
window.addEventListener("load", function(){
    recargando = false;
});

</script>

</body>
</html>
