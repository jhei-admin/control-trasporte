{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>{% block title %}Sistema de Despacho{% endblock %}</title>

<!-- Bootstrap -->
<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet"
>

<!-- Mapbox CSS -->
<link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">

<!-- Leaflet CSS -->
<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

/* =====================================================
   FONDO GENERAL
===================================================== */

body{
background:#f1f5f9;
font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
}

/* =====================================================
   TARJETAS
===================================================== */

.card-panel{
background:white;
padding:18px;
border-radius:10px;
box-shadow:0 3px 10px rgba(0,0,0,0.06);
}

/* =====================================================
   DASHBOARD ESTADISTICAS
===================================================== */

.dashboard{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:14px;
margin-bottom:20px;
}

.stat-card{
background:white;
border-radius:10px;
padding:14px;
box-shadow:0 3px 10px rgba(0,0,0,0.08);
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
}

.stat-num{
font-size:26px;
font-weight:700;
}

.stat-label{
font-size:13px;
color:#555;
}

.stat-green{border-top:4px solid #22c55e;}
.stat-blue{border-top:4px solid #0ea5e9;}
.stat-red{border-top:4px solid #ef4444;}
.stat-gray{border-top:4px solid #64748b;}

/* =====================================================
   TABLAS MODERNAS
===================================================== */

.table-modern{
border-collapse:separate;
border-spacing:0 10px;
}

.table-modern thead th{
border:none !important;
}

.table-modern tbody tr{
background:white;
box-shadow:0 3px 10px rgba(0,0,0,0.08);
border-radius:10px;
transition:all .15s ease;
}

.table-modern tbody td{
border:none !important;
padding:12px;
}

.table-modern tbody tr:hover{
background:#f8fafc;
transform:scale(1.01);
}

/* =====================================================
   FILA DESTACADA
===================================================== */

.proxima{
background:#ecfdf5 !important;
border-left:4px solid #22c55e;
}

/* =====================================================
   BADGES
===================================================== */

.badge-programado{
background:#0ea5e9;
color:white;
font-weight:600;
padding:6px 12px;
border-radius:6px;
}

.badge-atrasado{
background:#ef4444;
color:white;
font-weight:600;
padding:6px 12px;
border-radius:6px;
}

.badge-sinhora{
background:#64748b;
color:white;
font-weight:600;
padding:6px 12px;
border-radius:6px;
}

/* =====================================================
   BOTONES ICONO
===================================================== */

.btn-icon{
padding:5px 9px;
font-size:14px;
line-height:1;
min-width:34px;
display:inline-flex;
align-items:center;
justify-content:center;
}

/* =====================================================
   TOOLBAR
===================================================== */

.toolbar{
display:flex;
flex-wrap:wrap;
gap:8px;
margin-bottom:14px;
}

/* =====================================================
   ANIMACIONES
===================================================== */

button,.btn{
transition:all .15s ease;
}

button:hover,.btn:hover{
transform:translateY(-1px);
}

/* =====================================================
   INPUTS
===================================================== */

input.form-control{
border-radius:6px;
}

h2{
font-weight:700;
}

.table-dark th{
background:#1f2937 !important;
}

</style>

</head>

<body>

<div class="container mt-4">

{% block header %}{% endblock %}

{% if messages %}
<div class="mt-3">
{% for message in messages %}
<div class="alert alert-{{ message.tags }} alert-dismissible fade show">
{{ message }}
<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>
{% endfor %}
</div>
{% endif %}

{% block content %}{% endblock %}

</div>

<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Mapbox -->
<script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>

<!-- Chart -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

{% block extra_js %}{% endblock %}

</body>
</html>
