{% extends "flota_app/base.html" %}
{% load static %}

{% block title %}App Conductor{% endblock %}

{% block content %}
<style>
body.bg-light {
  background-color: #111 !important;
  color: #fff !important;
  text-align: center;
}

/* Contenedor libre (necesario para horizontal) */
.container {
  max-width: none !important;
  padding: 0 !important;
}

.estado {
  margin-top: 25px;
  padding: 22px;
  font-size: 20px;
  border-radius: 15px;
  white-space: pre-line;
}
.info { background: #424242; }
.ok { background: #2e7d32; }
.alerta { background: #ef6c00; }
.error { background: #b71c1c; }

button {
  font-size: 18px;
  padding: 14px 24px;
  margin-top: 15px;
  border-radius: 10px;
}

#qr-reader {
  width: 100%;
  max-width: 320px;
  margin: 20px auto;
  display: none;
}

/* ================= TOAST ================= */
.toast-marcacion {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  background: #1e1e1e;
  color: #fff;
  padding: 18px 22px;
  border-radius: 14px;
  min-width: 240px;
  text-align: center;
  box-shadow: 0 8px 25px rgba(0,0,0,0.6);
  z-index: 9999;
}

.toast-estado.adelantado { background: #0277bd; }
.toast-estado.a_tiempo { background: #2e7d32; }
.toast-estado.tarde { background: #c62828; }

/* ================= GPS ================= */
.gps-screen {
  width: 100vw;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

.gps-header, .gps-footer {
  padding: 10px 16px;
  background: #000;
  display: flex;
  justify-content: space-between;
}

.gps-body {
  flex: 1;
  display: flex;
}

.gps-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.gps-desvio { font-size: 48px; font-weight: bold; }

@media (orientation: portrait) {
  .gps-body { flex-direction: column; }
  .gps-atras, .gps-adelante { display: none; }
}
</style>

<!-- ================= QR ================= -->
<div id="pantallaQR">
  <div class="estado info">📷 Escanee el QR de la unidad</div>
  <button id="btnEscanear" class="btn btn-primary">📷 Escanear QR</button>
  <div id="qr-reader"></div>
</div>

<!-- ================= GPS ================= -->
<div id="pantallaEstado" class="gps-screen" style="display:none">
  <div class="gps-header">
    <span>🟢 Control de Ruta</span>
    <span id="gpsHora">--:--</span>
  </div>

  <div class="gps-body">
    <div class="gps-col gps-atras">
      <div id="gpsAtras"><div>—</div><div>—</div></div>
    </div>

    <div class="gps-col gps-centro">
      <div id="gpsDesvio" class="gps-desvio">0 min</div>
      <div id="gpsEstado" class="gps-estado ok">A TIEMPO</div>
      <div id="gpsBus" class="gps-bus">BUS</div>
    </div>

    <div class="gps-col gps-adelante">
      <div id="gpsAdelante"><div>—</div><div>—</div></div>
    </div>
  </div>

  <div class="gps-footer">
    Punto actual: <span id="gpsPunto">—</span>
  </div>
</div>

<!-- ================= TOAST ================= -->
<div id="toastMarcacion" class="toast-marcacion" style="display:none">
  <div id="toastTitulo">SALI</div>
  <div id="toastTiempo">-2 min</div>
  <div id="toastEstado" class="toast-estado adelantado">ADELANTADO</div>
</div>

{% endblock %}

{% block extra_js %}
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
const API_BASE = location.origin;
const $ = id => document.getElementById(id);

/* ================= QR ================= */
let qrScanner = null;
let escaneando = false;

function iniciarEscaneoQR() {
  unlockAudio();
  if (escaneando) return;

  escaneando = true;
  $("btnEscanear").disabled = true;
  $("qr-reader").style.display = "block";

  qrScanner = new Html5Qrcode("qr-reader");

  Html5Qrcode.getCameras().then(cameras => {
    const camaraId = cameras[cameras.length - 1].id;

    qrScanner.start(
      camaraId,
      { fps: 10, qrbox: 250 },
      async texto => {
        await qrScanner.stop();
        await qrScanner.clear();
        escaneando = false;
        $("qr-reader").style.display = "none";
        activarUnidad(texto);
      }
    );
  }).catch(err => {
    console.error(err);
    escaneando = false;
    $("btnEscanear").disabled = false;
  });
}

/* ================= AUDIO ================= */
let audioContext = null;
let audioBuffers = {};
let audioUnlocked = false;

async function unlockAudio() {
  if (audioUnlocked) return;
  audioContext = new (window.AudioContext || window.webkitAudioContext)();
  await audioContext.resume();

  const load = async (n,u)=>audioBuffers[n]=await audioContext.decodeAudioData(await (await fetch(u)).arrayBuffer());
  await load("beep","{% static 'flota_app/sonidos/beep_despacho.wav' %}");
  await load("audio_adelantado","{% static 'flota_app/sonidos/adelantado.mp3' %}");
  await load("audio_tarde","{% static 'flota_app/sonidos/tarde.mp3' %}");
  audioUnlocked = true;
}

function playAudio(n){
  if(!audioBuffers[n])return;
  const s=audioContext.createBufferSource();
  s.buffer=audioBuffers[n];
  s.connect(audioContext.destination);
  s.start();
}

/* ================= LOAD ================= */
window.addEventListener("load",()=>{
  const token=localStorage.getItem("token");
  if(token){
    $("pantallaQR").style.display="none";
    $("pantallaEstado").style.display="block";
    iniciarSistema();
  }else{
    $("btnEscanear").onclick=iniciarEscaneoQR;
  }
});
</script>
{% endblock %}
