{% extends "flota_app/base.html" %}
{% load static %}

{% block title %}App Conductor{% endblock %}

{% block content %}
<style>
body.bg-light {
  background-color: #111 !important;
  color: #fff !important;
  text-align: center;
}

.container {
  max-width: none !important;
  padding: 0 !important;
}

.estado {
  margin-top: 25px;
  padding: 22px;
  font-size: 20px;
  border-radius: 15px;
  white-space: pre-line;
}
.info { background: #424242; }
.ok { background: #2e7d32; }
.alerta { background: #ef6c00; }
.error { background: #b71c1c; }

button {
  font-size: 18px;
  padding: 14px 24px;
  margin-top: 15px;
  border-radius: 10px;
}

#qr-reader {
  width: 100%;
  max-width: 320px;
  margin: 20px auto;
  display: none;
}

/* ================= TOAST ================= */
.toast-marcacion {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  background: #1e1e1e;
  color: #fff;
  padding: 18px 22px;
  border-radius: 14px;
  min-width: 240px;
  z-index: 9999;
}

.toast-estado.adelantado { background: #0277bd; }
.toast-estado.a_tiempo { background: #2e7d32; }
.toast-estado.tarde { background: #c62828; }

/* ================= GPS ================= */
.gps-screen {
  width: 100vw;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

.gps-header,
.gps-footer {
  padding: 10px 16px;
  background: #000;
  display: flex;
  justify-content: space-between;
}

.gps-body {
  flex: 1;
  display: flex;
}

.gps-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.gps-desvio {
  font-size: 48px;
  font-weight: bold;
}

@media (orientation: portrait) {
  .gps-body { flex-direction: column; }
  .gps-atras,
  .gps-adelante { display: none; }
}
/* === AGREGADO: formato cola en una línea === */
.cola-item {
  font-size: 15px;
  opacity: 0.5;
  padding: 4px 0;
}
/* ================= HORA DE SALIDA (RESALTADA) ================= */
#gpsHora {
  font-size: 36px;        /* mucho más grande */
  font-weight: 900;      /* bien grueso */
  color: #00e676;        /* verde llamativo */
  letter-spacing: 2px;
}
/* ================= UNIDAD ACTUAL ================= */
.gps-bus {
  font-size: 24px;
  font-weight: 900;
  letter-spacing: 1px;
  color: #ffffff;
}
/* ================= UNIDADES ATRÁS ================= */
#gpsAtras .cola-item {
  font-size: 16px;
  font-weight: 600;
  color: #9e9e9e;
  opacity: 0.8;
}

/* ================= UNIDADES ADELANTE ================= */
#gpsAdelante .cola-item {
  font-size: 17px;
  font-weight: 700;
  color: #cfd8dc;
}

/* ================= SIGUIENTE UNIDAD (AZUL FUERTE) ================= */
#gpsAdelante .cola-item.siguiente {
  background: #0d47a1;
  color: #ffffff;
  font-size: 19px;
  font-weight: 900;
  padding: 10px 16px;
  border-radius: 16px;
  box-shadow: 0 0 14px rgba(33,150,243,0.7);
}
#gpsDesvio {
  font-size: 56px;
  font-weight: 900;
}
#gpsEstado {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 1px;
}
</style>

<!-- ================= QR ================= -->
<div id="pantallaQR">
  <div class="estado info">📷 Escanee el QR de la unidad</div>
  <button id="btnEscanear" class="btn btn-primary">📷 Escanear QR</button>
  <div id="qr-reader"></div>
</div>

<!-- ================= GPS ================= -->
<div id="pantallaEstado" class="gps-screen" style="display:none">
  <div class="gps-header">
    <span>🟢 Control de Ruta</span>
    <span id="gpsHora">--:--</span>
  </div>

  <div class="gps-body">
    <div class="gps-col gps-atras" id="gpsAtras"><div>—</div><div>—</div></div>

    <div class="gps-col gps-centro">
      <div id="gpsDesvio" class="gps-desvio">0 min</div>
      <div id="gpsEstado" class="gps-estado ok">A TIEMPO</div>
      <div id="gpsBus" class="gps-bus">BUS</div>
    </div>

    <div class="gps-col gps-adelante" id="gpsAdelante"><div>—</div><div>—</div></div>
  </div>

  <div class="gps-footer">
    Punto actual: <span id="gpsPunto">—</span>
  </div>
</div>

<!-- ================= TOAST ================= -->
<div id="toastMarcacion" class="toast-marcacion" style="display:none">
  <div id="toastTitulo">SALI</div>
  <div id="toastTiempo">-2 min</div>
  <div id="toastEstado" class="toast-estado adelantado">ADELANTADO</div>
</div>

{% endblock %}

{% block extra_js %}
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<script>
const API_BASE = location.origin;
const $ = id => document.getElementById(id);

/* ================= GLOBAL ================= */
let qrScanner = null;
let escaneando = false;
let estadoInterval = null;
let watchId = null;

/* ================= AUDIO ================= */
let audioContext = null;
let audioBuffers = {};
let audioUnlocked = false;
let audioReproduciendo = false;

async function unlockAudio() {
  if (audioUnlocked) return;

  audioContext = new (window.AudioContext || window.webkitAudioContext)();
  await audioContext.resume();

  async function load(name, url) {
    const res = await fetch(url);
    const buf = await res.arrayBuffer();
    audioBuffers[name] = await audioContext.decodeAudioData(buf);
  }

  await load("beep", "{% static 'flota_app/sonidos/beep_despacho.wav' %}");
  await load("audio_adelantado", "{% static 'flota_app/sonidos/adelantado.mp3' %}");
  await load("audio_tarde", "{% static 'flota_app/sonidos/tarde.mp3' %}");

  audioUnlocked = true;
}

function playAudio(name) {
  if (!audioUnlocked || !audioBuffers[name]) return;
  if (audioReproduciendo) return;

  audioReproduciendo = true;
  const src = audioContext.createBufferSource();
  src.buffer = audioBuffers[name];
  src.connect(audioContext.destination);

  src.onended = () => audioReproduciendo = false;
  src.start(0);
}

/* ================= QR ================= */
function iniciarEscaneoQR() {
  unlockAudio();
  if (escaneando) return;

  escaneando = true;
  $("btnEscanear").disabled = true;
  $("qr-reader").style.display = "block";

  qrScanner = new Html5Qrcode("qr-reader");

  Html5Qrcode.getCameras().then(cameras => {
    const camaraId = cameras[cameras.length - 1].id;

    qrScanner.start(
      camaraId,
      { fps: 10, qrbox: 250 },
      async texto => {
        await qrScanner.stop();
        await qrScanner.clear();

        $("qr-reader").style.display = "none";
        $("pantallaQR").style.display = "none";
        $("pantallaEstado").style.display = "block";

        escaneando = false;
        activarUnidad(texto);
      }
    );
  });
}

/* ================= ACTIVAR ================= */
function activarUnidad(texto) {
  let vehiculoId;
  try {
    vehiculoId = JSON.parse(texto).vehiculo_id;
  } catch {
    alert("❌ QR inválido");
    return;
  }

  fetch(`${API_BASE}/sistema/api/app/escanear-qr/`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ vehiculo_id: vehiculoId })
  })
  .then(r => r.json())
  .then(d => {
    if (!d.ok) return;
    localStorage.setItem("token", d.token);
    iniciarSistema();
  });
}

/* ================= SISTEMA ================= */
function iniciarSistema() {
  if (!estadoInterval)
    estadoInterval = setInterval(consultarEstado, 5000);

  iniciarGPSContinuo();
  consultarEstado();
}

/* ================= ESTADO ================= */
function consultarEstado() {
  const token = localStorage.getItem("token");
  if (!token) return;

  fetch(`${API_BASE}/sistema/api/app/estado/`, {
    method: "POST",
    headers: { "Authorization": "Bearer " + token }
  })
  .then(r => r.json())
  .then(data => {
    if (!data.autorizado) return;

    const horaPrev = localStorage.getItem("hora_salida");
    if (data.hora_salida && data.hora_salida !== horaPrev) {
      playAudio("beep");
      localStorage.setItem("hora_salida", data.hora_salida);
    }

    if (data.hora_salida)
      $("gpsHora").innerText = data.hora_salida;

    if (data.estado === "SALIDA_ACTIVA") {
      $("gpsEstado").innerText = "A TIEMPO";
      $("gpsEstado").className = "gps-estado ok";
    }
  });
}

/* ================= GPS ================= */
function iniciarGPSContinuo() {
  if (!navigator.geolocation || watchId) return;

  watchId = navigator.geolocation.watchPosition(pos => {
    const token = localStorage.getItem("token");
    if (!token) return;

    fetch(`${API_BASE}/sistema/api/gps/conductor/`, {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + token,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        lat: pos.coords.latitude,
        lng: pos.coords.longitude,
        precision: pos.coords.accuracy
      })
    });
  });
}

/* ================= LOAD ================= */
window.addEventListener("load", () => {
  const token = localStorage.getItem("token");
  if (token) {
    unlockAudio();
    $("pantallaQR").style.display = "none";
    $("pantallaEstado").style.display = "block";
    iniciarSistema();
  } else {
    $("btnEscanear").onclick = iniciarEscaneoQR;
  }
});

/* ============================================================
   🔥 BLOQUE AGREGADO — CONTEXTO DE COLA (NO SE BORRA NADA)
   ============================================================ */

function cargarColaContexto() {
  const token = localStorage.getItem("token");
  if (!token) return;

  fetch(`${API_BASE}/sistema/api/app/cola-contexto/`, {
    headers: { "Authorization": "Bearer " + token }
  })
  .then(r => r.json())
  .then(d => {
    if (!d.ok) return;

    // ===============================
    // 🚍 BUS ACTUAL (NO SE TOCA)
    // ===============================
    $("gpsBus").innerText = "UNIDAD " + d.actual.codigo;

    // ===============================
    // ⬅️ ATRÁS (ya salieron)
    // ===============================
    $("gpsAtras").innerHTML = d.atras.length
      ? d.atras.map(b =>
          `<div class="cola-item">
            UNIDAD ${b.codigo} · ${formatearMinutos(b.minutos)}
          </div>`
        ).join("")
      : "<div>—</div>";

    // ===============================
    // ➡️ ADELANTE (próximos)
    // ===============================
    $("gpsAdelante").innerHTML = d.adelante.length
      ? d.adelante.map((b, i) =>
          `<div class="cola-item ${i === 0 ? 'siguiente' : ''}">
            UNIDAD ${b.codigo} · ${formatearMinutos(b.minutos)}
          </div>`
        ).join("")
      : "<div>—</div>";
  });
}

/* ============================================================
   🔢 FORMATO DE MINUTOS (NUEVO — NO ROMPE NADA)
   ============================================================ */
function formatearMinutos(min) {
  if (min === null || min === undefined) return "--";

  if (min > 0) return `+${min} min`;
  if (min < 0) return `${min} min`;

  return "0 min";
}

setInterval(cargarColaContexto, 5000);
</script>
{% endblock %}
