{% extends "flota_app/base.html" %}
{% load static %}

{% block title %}App Conductor{% endblock %}

{% block content %}
<style>
body.bg-light {
  background-color: #111 !important;
  color: #fff !important;
  text-align: center;
}
.container { max-width: 420px; }

.estado {
  margin-top: 25px;
  padding: 22px;
  font-size: 20px;
  border-radius: 15px;
  white-space: pre-line;
}
.info { background: #424242; }
.ok { background: #2e7d32; }
.alerta { background: #ef6c00; }
.error { background: #b71c1c; }

button {
  font-size: 18px;
  padding: 14px 24px;
  margin-top: 15px;
  border-radius: 10px;
}

#qr-reader {
  width: 100%;
  max-width: 320px;
  margin: 20px auto;
  display: none;
}

/* ================= TOAST MARCACIÓN (OPCIÓN A) ================= */
.toast-marcacion {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  background: #1e1e1e;
  color: #fff;
  padding: 18px 22px;
  border-radius: 14px;
  min-width: 240px;
  text-align: center;
  box-shadow: 0 8px 25px rgba(0,0,0,0.6);
  z-index: 9999;
  animation: slideUp 0.3s ease;
}

.toast-titulo {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 6px;
}

.toast-tiempo {
  font-size: 16px;
  opacity: 0.9;
  margin-bottom: 8px;
}

.toast-estado {
  font-size: 15px;
  font-weight: 700;
  padding: 6px 14px;
  border-radius: 20px;
  display: inline-block;
}

/* Estados */
.toast-estado.adelantado { background: #0277bd; }
.toast-estado.a_tiempo { background: #2e7d32; }
.toast-estado.tarde { background: #c62828; }

@keyframes slideUp {
  from {
    opacity: 0;
    transform: translate(-50%, 20px);
  }
  to {
    opacity: 1;
    transform: translate(-50%, 0);
  }
}
</style>

<h1 class="mb-4">🚍 Control de Ruta</h1>

<div id="pantallaQR">
  <div class="estado info">📷 Escanee el QR de la unidad</div>
  <button id="btnEscanear" class="btn btn-primary">📷 Escanear QR</button>
  <div id="qr-reader"></div>
</div>

<div id="pantallaEstado" style="display:none">
  <div id="estadoConductor" class="estado info">⏳ Consultando estado...</div>
</div>

<!-- 📍 TOAST MARCACIÓN -->
<div id="toastMarcacion" class="toast-marcacion" style="display:none">
  <div id="toastTitulo" class="toast-titulo">SALI</div>
  <div id="toastTiempo" class="toast-tiempo">-2 min</div>
  <div id="toastEstado" class="toast-estado adelantado">ADELANTADO</div>
</div>

{% endblock %}

{% block extra_js %}
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<script>
const API_BASE = location.origin;

/* ================= GLOBAL ================= */
let qrScanner = null;
let escaneando = false;
let estadoInterval = null;
let watchId = null;
let ultimoEnvioGPS = 0;

/* ================= AUDIO ================= */
let audioContext = null;
let audioBuffers = {};
let audioUnlocked = false;
let ultimoAudioReproducido = null;

/* ================= TOAST ================= */
let toastTimeout = null;

/* ================= AUDIO ================= */
async function initAudio() {
  if (audioContext) return;
  audioContext = new (window.AudioContext || window.webkitAudioContext)();
}

async function loadAudio(name, url) {
  const res = await fetch(url);
  const buffer = await res.arrayBuffer();
  audioBuffers[name] = await audioContext.decodeAudioData(buffer);
}

async function unlockAudio() {
  if (audioUnlocked) return;
  await initAudio();
  await audioContext.resume();

  await loadAudio("beep", "{% static 'flota_app/sonidos/beep_despacho.wav' %}");
  await loadAudio("audio_adelantado", "{% static 'flota_app/sonidos/adelantado.mp3' %}");
  await loadAudio("audio_tarde", "{% static 'flota_app/sonidos/tarde.mp3' %}");
  await loadAudio("ruta_completada", "{% static 'flota_app/sonidos/ruta_completada.mp3' %}");

  audioUnlocked = true;
}

function playAudio(name) {
  if (!audioUnlocked || !audioBuffers[name]) return;
  const src = audioContext.createBufferSource();
  src.buffer = audioBuffers[name];
  src.connect(audioContext.destination);
  src.start(0);
}

function reproducirAudioSeguro(audioName) {
  if (!audioName) return;
  if (ultimoAudioReproducido === audioName) return;
  playAudio(audioName);
  ultimoAudioReproducido = audioName;
}

/* ================= UTIL ================= */
const $ = id => document.getElementById(id);

function mostrarEstado(texto, clase="info") {
  const el = $("estadoConductor");
  el.className = "estado " + clase;
  el.innerText = texto;
}

/* ================= TOAST MARCACIÓN ================= */
function mostrarMarcacionVisual(data) {
  if (!data) return;

  $("toastTitulo").innerText = data.codigo;
  $("toastTiempo").innerText =
    (data.diferencia_min > 0 ? "+" : "") + data.diferencia_min + " min";

  const estadoEl = $("toastEstado");
  estadoEl.innerText = data.estado;
  estadoEl.className = "toast-estado " + data.estado.toLowerCase();

  $("toastMarcacion").style.display = "block";

  if (toastTimeout) clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => {
    $("toastMarcacion").style.display = "none";
  }, 6000);
}

/* ================= LOAD ================= */
window.addEventListener("load", () => {
  const token = localStorage.getItem("token");

  if (token) {
    unlockAudio();
    $("pantallaQR").style.display = "none";
    $("pantallaEstado").style.display = "block";
    mostrarEstadoGuardado();
    iniciarSistema();
    return;
  }

  $("btnEscanear").onclick = iniciarEscaneoQR;
});

/* ================= QR ================= */
function iniciarEscaneoQR() {
  unlockAudio();
  if (escaneando) return;

  escaneando = true;
  $("btnEscanear").disabled = true;
  $("qr-reader").style.display = "block";

  qrScanner = new Html5Qrcode("qr-reader");

  Html5Qrcode.getCameras().then(cameras => {
    const camaraId = cameras[cameras.length - 1].id;

    qrScanner.start(
      camaraId,
      { fps: 10, qrbox: { width: 250, height: 250 } },
      async texto => {
        await qrScanner.stop();
        await qrScanner.clear();
        $("qr-reader").style.display = "none";
        activarUnidad(texto);
      }
    );
  });
}

/* ================= ACTIVAR ================= */
function activarUnidad(texto) {
  let vehiculoId;
  try {
    vehiculoId = JSON.parse(texto).vehiculo_id;
  } catch {
    alert("❌ QR inválido");
    return;
  }

  fetch(`${API_BASE}/sistema/api/app/escanear-qr/`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ vehiculo_id: vehiculoId })
  })
  .then(r => r.json())
  .then(d => {
    if (!d.ok) return;
    localStorage.setItem("token", d.token);
    iniciarSistema();
  });
}

/* ================= SISTEMA ================= */
function iniciarSistema() {
  if (!estadoInterval)
    estadoInterval = setInterval(consultarEstado, 5000);

  iniciarGPSContinuo();
  consultarEstado();
}

/* ================= ESTADO ================= */
function consultarEstado() {
  const token = localStorage.getItem("token");
  if (!token) return;

  fetch(`${API_BASE}/sistema/api/app/estado/`, {
    method: "POST",
    headers: { "Authorization": "Bearer " + token }
  })
  .then(r => r.json())
  .then(data => {
    if (!data.autorizado) return;

    if (data.estado === "SALIDA_ACTIVA")
      mostrarEstado(`🟢 SALIDA ACTIVA\nHora: ${data.hora_salida}`, "ok");
    else if (data.estado === "EN_COLA")
      mostrarEstado(`⏳ EN COLA\nSalida: ${data.hora_salida}`, "info");
    else
      mostrarEstado("⏳ ESPERANDO HORA DE SALIDA", "info");
  });
}

/* ================= GPS ================= */
function iniciarGPSContinuo() {
  if (!navigator.geolocation || watchId) return;

  watchId = navigator.geolocation.watchPosition(
    pos => {
      const ahora = Date.now();
      if (ahora - ultimoEnvioGPS < 5000) return;
      ultimoEnvioGPS = ahora;

      const token = localStorage.getItem("token");
      if (!token) return;

      fetch(`${API_BASE}/sistema/api/gps/conductor/`, {
        method: "POST",
        headers: {
          "Authorization": "Bearer " + token,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          lat: pos.coords.latitude,
          lng: pos.coords.longitude
        })
      })
      .then(r => r.json())
      .then(resp => {
        if (resp.accion === "audio")
          reproducirAudioSeguro(resp.audio);

        if (resp.visual)
          mostrarMarcacionVisual(resp.visual);
      });
    },
    err => console.log("GPS error:", err.message),
    { enableHighAccuracy: true }
  );
}

function mostrarEstadoGuardado() {
  const data = localStorage.getItem("estado_visual");
  if (!data) return;
  try {
    const d = JSON.parse(data);
    if (d.estado === "SALIDA_ACTIVA")
      mostrarEstado(`🟢 SALIDA ACTIVA\nHora: ${d.hora_salida}`, "ok");
  } catch {}
}
</script>
{% endblock %}
