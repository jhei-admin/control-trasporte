{% extends "flota_app/base.html" %}
{% load static %}

{% block title %}App Conductor{% endblock %}

{% block content %}
<style>
body.bg-light {
  background-color: #111 !important;
  color: #fff !important;
  text-align: center;
}

.container {
  max-width: none !important;
  padding: 0 !important;
}

/* ================= ESTADO ================= */
.estado {
  margin-top: 25px;
  padding: 22px;
  font-size: 20px;
  border-radius: 15px;
  white-space: pre-line;
}
.info { background: #424242; }
.ok { background: #2e7d32; }
.alerta { background: #ef6c00; }
.error { background: #b71c1c; }

button {
  font-size: 18px;
  padding: 14px 24px;
  margin-top: 15px;
  border-radius: 10px;
}

#qr-reader {
  width: 100%;
  max-width: 320px;
  margin: 20px auto;
  display: none;
}

/* ================= GPS ================= */
.gps-screen {
  width: 100vw;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

.gps-header,
.gps-footer {
  padding: 10px 16px;
  background: #000;
  display: flex;
  justify-content: space-between;
}

.gps-body {
  flex: 1;
  display: flex;
}

.gps-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 10px;
}

.gps-atras,
.gps-adelante {
  opacity: 0.4;
  font-size: 14px;
}

.gps-centro {
  transform: scale(1.05);
}

.gps-adelante .unidad-siguiente {
  background: #0d47a1;
  border-left: 4px solid #42a5f5;
  padding: 10px;
  border-radius: 12px;
  font-weight: bold;
}

.gps-desvio {
  font-size: 48px;
  font-weight: bold;
}

.gps-estado {
  padding: 8px 14px;
  border-radius: 12px;
  font-size: 18px;
}

.gps-bus {
  margin-top: 6px;
  font-size: 22px;
  font-weight: bold;
}

@media (orientation: portrait) {
  .gps-body { flex-direction: column; }
  .gps-atras,
  .gps-adelante { display: none; }
}
</style>

<!-- ================= QR ================= -->
<div id="pantallaQR">
  <div class="estado info">📷 Escanee el QR de la unidad</div>
  <button id="btnEscanear"
          class="btn btn-primary"
          onclick="iniciarEscaneoQR()">
    📷 Escanear QR
  </button>
  <div id="qr-reader"></div>
</div>

<!-- ================= GPS ================= -->
<div id="pantallaEstado" class="gps-screen" style="display:none">
  <div class="gps-header">
    <span>🟢 Control de Ruta</span>
    <span id="gpsHora">--:--</span>
  </div>

  <div class="gps-body">
    <div class="gps-col gps-atras" id="gpsAtras">
      <div>—</div><div>—</div>
    </div>

    <div class="gps-col gps-centro">
      <div id="gpsDesvio" class="gps-desvio">0 min</div>
      <div id="gpsEstado" class="gps-estado ok">A TIEMPO</div>
      <div id="gpsBus" class="gps-bus">🚍 UNIDAD</div>
    </div>

    <div class="gps-col gps-adelante" id="gpsAdelante">
      <div>—</div><div>—</div>
    </div>
  </div>

  <div class="gps-footer">
    📍 Punto actual: <span id="gpsPunto">—</span>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<script>
const API_BASE = location.origin;
const $ = id => document.getElementById(id);

/* ================= QR ================= */
let qrScanner = null;
let escaneando = false;
let estadoInterval = null;

function iniciarEscaneoQR() {
  if (escaneando) return;

  escaneando = true;
  $("btnEscanear").disabled = true;
  $("qr-reader").style.display = "block";

  qrScanner = new Html5Qrcode("qr-reader");

  Html5Qrcode.getCameras().then(cameras => {
    if (!cameras.length) {
      alert("❌ No se detectó cámara");
      escaneando = false;
      $("btnEscanear").disabled = false;
      return;
    }

    const camaraId = cameras[cameras.length - 1].id;

    qrScanner.start(
      camaraId,
      { fps: 10, qrbox: 250 },
      async texto => {
        await qrScanner.stop();
        await qrScanner.clear();

        $("qr-reader").style.display = "none";
        $("pantallaQR").style.display = "none";
        $("pantallaEstado").style.display = "block";

        escaneando = false;
        activarUnidad(texto);
      }
    );
  });
}

/* ================= ACTIVAR ================= */
function activarUnidad(texto) {
  let vehiculoId;
  try {
    vehiculoId = JSON.parse(texto).vehiculo_id;
  } catch {
    alert("❌ QR inválido");
    $("btnEscanear").disabled = false;
    escaneando = false;
    return;
  }

  fetch(`${API_BASE}/sistema/api/app/escanear-qr/`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ vehiculo_id: vehiculoId })
  })
  .then(r => r.json())
  .then(d => {
    if (!d.ok) {
      alert("❌ No autorizado");
      return;
    }

    localStorage.setItem("token", d.token);
    iniciarSistema();
  });
}

/* ================= SISTEMA ================= */
function iniciarSistema() {
  if (!estadoInterval)
    estadoInterval = setInterval(cargarColaContexto, 5000);

  cargarColaContexto();
}

/* ================= CONTEXTO ================= */
function cargarColaContexto() {
  const token = localStorage.getItem("token");
  if (!token) return;

  fetch(`${API_BASE}/sistema/api/app/cola-contexto/`, {
    headers: { "Authorization": "Bearer " + token }
  })
  .then(r => r.json())
  .then(d => {
    if (!d || !d.ok) return;

    $("gpsBus").innerText = "🚍 UNIDAD " + d.actual.codigo;

    $("gpsAtras").innerHTML = d.atras.length
      ? d.atras.map(b => `<div>⬅️ ${b.codigo} · ${b.hora_salida}</div>`).join("")
      : "<div>—</div>";

    $("gpsAdelante").innerHTML = d.adelante.length
      ? d.adelante.map((b, i) =>
          `<div class="${i === 0 ? 'unidad-siguiente' : ''}">
            ➡️ ${b.codigo} · ${b.hora_salida}
           </div>`
        ).join("")
      : "<div>—</div>";
  });
}
</script>
{% endblock %}
