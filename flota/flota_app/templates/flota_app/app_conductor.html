{% extends "base.html" %}
{% load static %}

{% block title %}App Conductor{% endblock %}

{% block content %}

<!-- =========================
     🎨 ESTILO APP CONDUCTOR
========================= -->
<style>
body.bg-light {
  background-color: #111 !important;
  color: #fff !important;
  text-align: center;
}

body.bg-light .container {
  background-color: #111 !important;
}

.container {
  max-width: 420px;
}

.estado {
  margin-top: 25px;
  padding: 22px;
  font-size: 20px;
  border-radius: 15px;
  white-space: pre-line;
}

.info { background: #424242; }
.ok { background: #2e7d32; }
.alerta { background: #ef6c00; }
.error { background: #b71c1c; }

button {
  font-size: 18px;
  padding: 14px 24px;
  margin-top: 15px;
  border-radius: 10px;
}

#qr-reader {
  width: 100%;
  max-width: 320px;
  margin: 20px auto;
  display: none;
}
</style>

<h1 class="mb-4">🚍 Control de Ruta</h1>

<!-- ========================= QR ========================= -->
<div id="pantallaQR">
  <div class="estado info">📷 Escanee el QR de la unidad</div>
  <button id="btnEscanear" class="btn btn-primary">📷 Escanear QR</button>
  <div id="qr-reader"></div>
</div>

<!-- ========================= ESTADO ========================= -->
<div id="pantallaEstado" style="display:none">
  <div id="estadoConductor" class="estado info">
    ⏳ Consultando estado...
  </div>
</div>

<!-- 🔊 AUDIO -->
<audio id="sonidoAviso" src="{% static 'flota_app/sonidos/aviso_salida.mp3' %}"></audio>

{% endblock %}

{% block extra_js %}

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<script>
/* =========================================================
   CONFIG (🔥 FIX DEFINITIVO)
========================================================= */
const API_BASE = location.origin;   // ⛔ NUNCA hardcodear Render

let qrScanner = null;
let escaneando = false;
let estadoInterval = null;
let gpsInterval = null;
let heartbeatInterval = null;

/* =========================================================
   UTIL
========================================================= */
function $(id) {
  return document.getElementById(id);
}

/* =========================================================
   UI
========================================================= */
function mostrarEstado(texto, clase="info") {
  const el = $("estadoConductor");
  if (!el) return;
  el.className = "estado " + clase;
  el.innerText = texto;
}

/* =========================================================
   RESET TOTAL (ANTI CACHE / ANTI BUG)
========================================================= */
function resetSistema() {
  if (estadoInterval) clearInterval(estadoInterval);
  if (gpsInterval) clearInterval(gpsInterval);
  if (heartbeatInterval) clearInterval(heartbeatInterval);

  estadoInterval = null;
  gpsInterval = null;
  heartbeatInterval = null;

  localStorage.removeItem("token");

  $("pantallaEstado").style.display = "none";
  $("pantallaQR").style.display = "block";

  resetEscaneo();
}

/* =========================================================
   ESCANEAR QR
========================================================= */
window.addEventListener("load", () => {

  // 👉 SI YA HAY TOKEN, NO ESCANEA DE NUEVO
  const token = localStorage.getItem("token");
  if (token) {
    iniciarSistema();
    return;
  }

  const btn = $("btnEscanear");
  if (!btn) return;

  btn.onclick = () => {
    if (escaneando) return;
    escaneando = true;

    btn.disabled = true;
    $("qr-reader").style.display = "block";

    qrScanner = new Html5Qrcode("qr-reader");

    qrScanner.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: 250 },
      async texto => {
        try {
          await qrScanner.stop();
          await qrScanner.clear();
        } catch {}

        $("qr-reader").style.display = "none";
        activarUnidad(texto);
      }
    );
  };
});

/* =========================================================
   ACTIVAR UNIDAD
========================================================= */
function activarUnidad(texto) {
  let vehiculoId;

  try {
    vehiculoId = JSON.parse(texto).vehiculo_id;
  } catch {
    alert("❌ QR inválido");
    resetEscaneo();
    return;
  }

  fetch(`${API_BASE}/sistema/api/app/escanear-qr/`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ vehiculo_id: vehiculoId })
  })
  .then(r => r.json())
  .then(data => {
    if (!data.ok || !data.token) {
      alert("❌ No autorizado");
      resetSistema();
      return;
    }

    localStorage.setItem("token", data.token);
    iniciarSistema();
  })
  .catch(() => {
    alert("❌ Error de conexión");
    resetSistema();
  });
}

/* =========================================================
   SISTEMA PRINCIPAL
========================================================= */
function iniciarSistema() {
  $("pantallaQR").style.display = "none";
  $("pantallaEstado").style.display = "block";

  consultarEstado();
  estadoInterval = setInterval(consultarEstado, 5000);

  iniciarHeartbeat();
  iniciarGPS();
}

/* =========================================================
   CONSULTAR ESTADO (🔥 FIX REAL DEFINITIVO)
========================================================= */
function consultarEstado() {
  const token = localStorage.getItem("token");
  if (!token) return;

  fetch(`${API_BASE}/sistema/api/app/estado/`, {
    method: "POST",
    headers: {
      "Authorization": "Bearer " + token,
      "Content-Type": "application/json"
    }
  })
  .then(r => r.json())
  .then(data => {

    if (!data.autorizado) {
      mostrarEstado("❌ " + data.mensaje, "error");
      resetSistema();
      return;
    }

    switch (data.estado) {

      case "SALIDA_ACTIVA":
        // 🔒 DEFENSA FINAL: si backend no confirma hora_real → NO ACTIVA
        if (!data.hora_real_salida) {
          mostrarEstado(
            "⏳ EN COLA\nSalida: " + data.hora_salida,
            "info"
          );
        } else {
          mostrarEstado(
            "🟢 SALIDA ACTIVA\nHora: " + data.hora_salida,
            "ok"
          );
        }
        break;

      case "AVISO_SALIDA":
        mostrarEstado(
          "🟠 PRÓXIMA SALIDA\n" + data.mensaje,
          "alerta"
        );
        document.getElementById("sonidoAviso").play();
        break;

      case "EN_COLA":
        mostrarEstado(
          "⏳ EN COLA\nSalida: " + data.hora_salida,
          "info"
        );
        break;

      case "SALIDA_PROGRAMADA":
        mostrarEstado(
          "⏳ SALIDA PROGRAMADA\nHora: " + data.hora_salida,
          "info"
        );
        break;

      default:
        mostrarEstado(data.mensaje || data.estado, "info");
    }
  })
  .catch(() => {
    mostrarEstado("❌ Error de conexión", "error");
  });
}

/* =========================================================
   HEARTBEAT
========================================================= */
function iniciarHeartbeat() {
  const token = localStorage.getItem("token");
  if (!token) return;

  heartbeatInterval = setInterval(() => {
    fetch(`${API_BASE}/sistema/api/app/heartbeat/`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token })
    }).catch(() => {});
  }, 30000);
}

/* =========================================================
   GPS
========================================================= */
function iniciarGPS() {
  if (!navigator.geolocation) {
    mostrarEstado("❌ GPS no disponible", "error");
    return;
  }

  gpsInterval = setInterval(() => {
    navigator.geolocation.getCurrentPosition(
      pos => enviarGPS(pos),
      () => {},
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
    );
  }, 5000);
}

function enviarGPS(position) {
  const token = localStorage.getItem("token");
  if (!token) return;

  fetch(`${API_BASE}/sistema/api/gps/`, {
    method: "POST",
    headers: {
      "Authorization": "Bearer " + token,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      lat: position.coords.latitude,
      lng: position.coords.longitude,
      velocidad: position.coords.speed || 0,
      precision: position.coords.accuracy || null
    })
  }).catch(() => {});
}

/* =========================================================
   RESET QR
========================================================= */
function resetEscaneo() {
  escaneando = false;
  const btn = $("btnEscanear");
  if (btn) btn.disabled = false;
}
</script>

{% endblock %}
