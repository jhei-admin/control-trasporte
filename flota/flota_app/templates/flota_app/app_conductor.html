{% extends "base.html" %}
{% load static %}

{% block title %}App Conductor{% endblock %}

{% block content %}

<style>
body.bg-light {
  background-color: #111 !important;
  color: #fff !important;
  text-align: center;
}
body.bg-light .container {
  background-color: #111 !important;
}
.container { max-width: 420px; }

.estado {
  margin-top: 25px;
  padding: 22px;
  font-size: 20px;
  border-radius: 15px;
  white-space: pre-line;
}
.info { background: #424242; }
.ok { background: #2e7d32; }
.alerta { background: #ef6c00; }
.error { background: #b71c1c; }

button {
  font-size: 18px;
  padding: 14px 24px;
  margin-top: 15px;
  border-radius: 10px;
}

#qr-reader {
  width: 100%;
  max-width: 320px;
  margin: 20px auto;
  display: none;
}
</style>

<h1 class="mb-4">🚍 Control de Ruta</h1>

<div id="pantallaQR">
  <div class="estado info">📷 Escanee el QR de la unidad</div>
  <button id="btnEscanear" class="btn btn-primary">📷 Escanear QR</button>
  <div id="qr-reader"></div>
</div>

<div id="pantallaEstado" style="display:none">
  <div id="estadoConductor" class="estado info">
    ⏳ Consultando estado...
  </div>
</div>

{% endblock %}

{% block extra_js %}
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<script>
/* ================= CONFIG ================= */
const API_BASE = location.origin;

/* ================= GLOBAL ================= */
let qrScanner = null;
let escaneando = false;
let estadoInterval = null;

let avisoActivo = false;
let countdownInterval = null;
let segundosRestantes = 0;
let horaProgramada = null;

let estadoAnterior = localStorage.getItem("estado_anterior") || null;

/* ================= WEB AUDIO API (ANTI-CORTE) ================= */
let audioContext = null;
let audioBuffers = {};
let audioUnlocked = false;

async function initAudio() {
  if (audioContext) return;
  audioContext = new (window.AudioContext || window.webkitAudioContext)();
}

async function loadAudio(name, url) {
  const res = await fetch(url);
  const buffer = await res.arrayBuffer();
  audioBuffers[name] = await audioContext.decodeAudioData(buffer);
}

async function unlockAudio() {
  if (audioUnlocked) return;
  await initAudio();
  await audioContext.resume();

  await loadAudio("aviso", "{% static 'flota_app/sonidos/aviso_salida.mp3' %}");
  await loadAudio("salida", "{% static 'flota_app/sonidos/inicio_salida.mp3' %}");

  audioUnlocked = true;
}

function playAudio(name) {
  if (!audioUnlocked || !audioBuffers[name]) return;
  const src = audioContext.createBufferSource();
  src.buffer = audioBuffers[name];
  src.connect(audioContext.destination);
  src.start(0);
}

/* ================= UTIL ================= */
const $ = id => document.getElementById(id);

function mostrarEstado(texto, clase="info") {
  const el = $("estadoConductor");
  el.className = "estado " + clase;
  el.innerText = texto;
}

/* ================= QR ================= */
window.addEventListener("load", () => {
  const token = localStorage.getItem("token");

  if (token) {
    unlockAudio();
    iniciarSistema();
    return;
  }

  $("btnEscanear").onclick = async () => {
    await unlockAudio();

    if (escaneando) return;
    escaneando = true;
    $("btnEscanear").disabled = true;
    $("qr-reader").style.display = "block";

    qrScanner = new Html5Qrcode("qr-reader");
    qrScanner.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: 250 },
      async texto => {
        try { await qrScanner.stop(); await qrScanner.clear(); } catch {}
        $("qr-reader").style.display = "none";
        activarUnidad(texto);
      }
    );
  };
});

/* ================= ACTIVAR ================= */
function activarUnidad(texto) {
  let vehiculoId;
  try { vehiculoId = JSON.parse(texto).vehiculo_id; }
  catch { alert("❌ QR inválido"); resetEscaneo(); return; }

  fetch(`${API_BASE}/sistema/api/app/escanear-qr/`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ vehiculo_id: vehiculoId })
  })
  .then(r => r.json())
  .then(d => {
    if (!d.ok || !d.token) return;
    localStorage.setItem("token", d.token);
    iniciarSistema();
  });
}

/* ================= SISTEMA ================= */
function iniciarSistema() {
  $("pantallaQR").style.display = "none";
  $("pantallaEstado").style.display = "block";

  consultarEstado();
  estadoInterval = setInterval(consultarEstado, 5000);
}

/* ================= ESTADO ================= */
function consultarEstado() {
  const token = localStorage.getItem("token");
  if (!token) return;

  fetch(`${API_BASE}/sistema/api/app/estado/`, {
    method: "POST",
    headers: {
      "Authorization": "Bearer " + token,
      "Content-Type": "application/json"
    }
  })
  .then(r => r.json())
  .then(data => {

    if (!data.autorizado) return;

    const estadoActual = data.estado;

    if (estadoAnterior !== estadoActual) {

      if (estadoActual === "AVISO_SALIDA") {
        playAudio("aviso");
      }

      if (estadoActual === "SALIDA_ACTIVA") {
        playAudio("salida");
      }

      if (estadoActual === "SIN_SALIDA") {
        detenerCountdown();
        avisoActivo = false;
      }

      estadoAnterior = estadoActual;
      localStorage.setItem("estado_anterior", estadoActual);
    }

    switch (estadoActual) {

      case "AVISO_SALIDA":
        if (!avisoActivo) {
          avisoActivo = true;
          horaProgramada = data.hora_salida;
          iniciarAviso(120);
        }
        break;

      case "SALIDA_ACTIVA":
        detenerCountdown();
        mostrarEstado("🟢 SALIDA ACTIVA\nHora: " + data.hora_salida, "ok");
        break;

      case "EN_COLA":
        detenerCountdown();
        mostrarEstado("⏳ EN COLA\nSalida: " + data.hora_salida, "info");
        break;

      case "SIN_SALIDA":
        mostrarEstado("⏳ Espere orden de salida", "info");
        break;

      default:
        mostrarEstado(data.mensaje || estadoActual, "info");
    }
  });
}

/* ================= AVISO + COUNTDOWN ================= */
function iniciarAviso(segundos) {
  segundosRestantes = segundos;

  countdownInterval = setInterval(() => {
    if (segundosRestantes <= 0) {
      detenerCountdown();
      mostrarEstado(`⏳ SALIDA PROGRAMADA\nHora: ${horaProgramada}`, "info");
      return;
    }

    const min = Math.floor(segundosRestantes / 60);
    const sec = segundosRestantes % 60;

    mostrarEstado(
      `🟠 PRÓXIMA SALIDA\n${min}:${sec.toString().padStart(2, "0")}`,
      "alerta"
    );

    segundosRestantes--;
  }, 1000);
}

function detenerCountdown() {
  if (countdownInterval) {
    clearInterval(countdownInterval);
    countdownInterval = null;
  }
}

function resetEscaneo() {
  escaneando = false;
  $("btnEscanear").disabled = false;
}
</script>
{% endblock %}
