{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Control Transporte | Acceso</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* ---------- BACKGROUND ---------- */

body{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
font-family:system-ui,-apple-system,Segoe UI,Roboto;
overflow:hidden;

background:
linear-gradient(rgba(10,20,40,.75),rgba(10,20,40,.85)),
url("{% static 'img/arequipa.jpg' %}");

background-size:cover;
background-position:center;
}

/* ---------- CONTENEDOR ---------- */

.login-wrapper{

width:1100px;
max-width:95%;

display:flex;

border-radius:20px;
overflow:hidden;

background:rgba(255,255,255,.05);
backdrop-filter:blur(20px);

border:1px solid rgba(255,255,255,.15);

box-shadow:0 40px 120px rgba(0,0,0,.7);

animation:fadeLogin .6s ease;

}

@keyframes fadeLogin{

from{opacity:0; transform:translateY(30px);}
to{opacity:1; transform:translateY(0);}

}

/* ---------- LADO IZQUIERDO ---------- */

.login-left{

flex:1;

display:flex;
flex-direction:column;
align-items:center;
justify-content:center;

padding:60px;

color:white;
text-align:center;

position:relative;

}

/* BUS */

.bus{

width:420px;
max-width:100%;

filter:drop-shadow(0 40px 80px rgba(0,0,0,.7));

animation:floatBus 6s ease-in-out infinite;

}

@keyframes floatBus{

0%{transform:translateY(0)}
50%{transform:translateY(-12px)}
100%{transform:translateY(0)}

}

/* GPS LINE */

.gps-line{

position:absolute;
bottom:80px;
left:20%;

width:300px;
height:2px;

background:linear-gradient(90deg,#38bdf8,#0ea5e9);

animation:gpsMove 3s linear infinite;

}

@keyframes gpsMove{

0%{opacity:.3}
50%{opacity:1}
100%{opacity:.3}

}

.login-left h2{

margin-top:20px;
font-weight:700;

}

.login-left p{

opacity:.85;
font-size:15px;

}

/* ---------- LADO DERECHO ---------- */

.login-right{

flex:1;

background:rgba(255,255,255,.95);

padding:70px;

display:flex;
flex-direction:column;
justify-content:center;

}

/* TITULO */

.logo{

font-size:30px;
font-weight:700;

margin-bottom:8px;

}

.subtitle{

color:#64748b;
margin-bottom:35px;

}

/* INPUTS */

.input-group{

margin-bottom:20px;

}

.input-group-text{

background:#f1f5f9;
border:none;

}

.form-control{

border:none;
background:#f1f5f9;

padding:12px;

transition:.2s;

}

.form-control:focus{

background:#e2e8f0;

box-shadow:0 0 0 2px #0ea5e9;

}

/* BOTON */

.btn-login{

width:100%;
padding:12px;

background:linear-gradient(135deg,#38bdf8,#0284c7);

border:none;

border-radius:8px;

font-weight:600;

color:white;

transition:.2s;

}

.btn-login:hover{

transform:translateY(-2px);

box-shadow:0 10px 25px rgba(2,132,199,.45);

}

/* ERROR */

.alert-error{

background:#fee2e2;
color:#991b1b;

padding:10px;

border-radius:6px;

margin-top:15px;

text-align:center;

font-size:14px;

}

/* ---------- RESPONSIVE ---------- */

@media (max-width:900px){

.login-wrapper{
flex-direction:column;
}

.login-left{
display:none;
}

.login-right{
padding:40px;
}

}

</style>

</head>

<body>

<div class="login-wrapper">

<!-- IZQUIERDA -->

<div class="login-left">

<img src="{% static 'img/bus.png' %}" class="bus">

<div class="gps-line"></div>

<h2>Control Transporte</h2>

<p>
Sistema inteligente para gestión y control de flotas
</p>

</div>

<!-- DERECHA -->

<div class="login-right">

<div class="logo">
🚍 Control Transporte
</div>

<div class="subtitle">
Sistema de Gestión de Flotas | Arequipa
</div>

<form method="POST">

{% csrf_token %}

<div class="input-group">

<span class="input-group-text">
<i class="fa fa-user"></i>
</span>

<input
type="text"
name="username"
class="form-control"
placeholder="Usuario"
required>

</div>

<div class="input-group">

<span class="input-group-text">
<i class="fa fa-lock"></i>
</span>

<input
type="password"
name="password"
class="form-control"
placeholder="Contraseña"
required>

</div>

<button type="submit" class="btn btn-login">
Entrar al sistema
</button>

{% if form.errors %}

<div class="alert-error">
Usuario o contraseña incorrectos
</div>

{% endif %}

</form>

</div>

</div>

</body>
</html>
