{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">

<title>Acceso | Control Transporte</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(135deg,#0f172a,#1e293b,#334155);
font-family:system-ui,-apple-system,Segoe UI,Roboto;
}

/* animación */

.login-wrapper{
animation:fadeLogin .6s ease;
}

@keyframes fadeLogin{
from{opacity:0; transform:translateY(25px);}
to{opacity:1; transform:translateY(0);}
}

/* contenedor principal */

.login-wrapper{
width:950px;
max-width:95%;
background:white;
border-radius:16px;
overflow:hidden;
display:flex;
box-shadow:0 25px 60px rgba(0,0,0,.35);
}

/* PANEL IZQUIERDO */

.login-left{
flex:1;

/* fondo con bus */

background:
linear-gradient(
rgba(0,0,0,0.55),
rgba(0,0,0,0.55)
),
url("{% static 'img/van.jpg' %}");

background-size:cover;
background-position:center;

color:white;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
padding:40px;
text-align:center;
}

/* contenedor glass */

.left-content{
background:rgba(255,255,255,0.08);
padding:35px;
border-radius:14px;
backdrop-filter: blur(6px);
box-shadow:0 10px 30px rgba(0,0,0,0.25);
}

/* icono */

.login-left img{
width:200px;
margin-bottom:20px;
}

/* textos */

.login-left h2{
font-weight:700;
margin-bottom:10px;
}

.login-left p{
opacity:.9;
font-size:15px;
}

/* PANEL DERECHO */

.login-right{
flex:1;
padding:55px;
display:flex;
flex-direction:column;
justify-content:center;
}

/* titulo */

.logo{
font-size:26px;
font-weight:700;
margin-bottom:10px;
}

.subtitle{
color:#6b7280;
margin-bottom:30px;
}

/* inputs */

.input-group{
margin-bottom:18px;
}

.input-group-text{
background:#f1f5f9;
border:none;
}

.form-control{
border:none;
background:#f1f5f9;
padding:12px;
transition:all .2s ease;
}

.form-control:focus{
background:#e2e8f0;
box-shadow:0 0 0 2px #0ea5e9;
}

/* botón */

.btn-login{
width:100%;
padding:12px;
font-weight:600;
background:#0ea5e9;
border:none;
border-radius:8px;
transition:.25s;
}

.btn-login:hover{
background:#0284c7;
transform:translateY(-2px);
box-shadow:0 8px 20px rgba(14,165,233,.35);
}

/* error */

.alert-error{
background:#fee2e2;
color:#991b1b;
padding:10px;
border-radius:6px;
margin-top:15px;
text-align:center;
font-size:14px;
}

/* responsive */

@media (max-width:900px){

.login-wrapper{
flex-direction:column;
}

.login-left{
display:none;
}

.login-right{
padding:35px;
}

}

</style>

</head>

<body>

<div class="login-wrapper">

<!-- PANEL IZQUIERDO -->

<div class="login-left">

<div class="left-content">

<img src="https://cdn-icons-png.flaticon.com/512/1995/1995470.png">

<h2>Control Transporte</h2>

<p>
Sistema profesional para gestión y despacho de flota
</p>

</div>

</div>

<!-- PANEL DERECHO -->

<div class="login-right">

<div class="logo">
🚍 Control Transporte
</div>

<div class="subtitle">
Acceso panel del despachador
</div>

<form method="POST" action="{% url 'login' %}">

{% csrf_token %}

{% if next %}
<input type="hidden" name="next" value="{{ next }}">
{% endif %}

<div class="input-group">
<span class="input-group-text">
<i class="fa fa-user"></i>
</span>

<input
type="text"
name="username"
class="form-control"
placeholder="Usuario"
autocomplete="username"
autofocus
required>
</div>

<div class="input-group">
<span class="input-group-text">
<i class="fa fa-lock"></i>
</span>

<input
type="password"
name="password"
class="form-control"
placeholder="Contraseña"
autocomplete="current-password"
required>
</div>

<button type="submit" class="btn btn-login">
Entrar al sistema
</button>

{% if form.errors %}
<div class="alert-error">
Usuario o contraseña incorrectos
</div>
{% endif %}

</form>

</div>

</div>

</body>
</html>
