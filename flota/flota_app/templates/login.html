{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Control Transporte | Acceso</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
font-family:system-ui,-apple-system,Segoe UI,Roboto;
overflow:hidden;

/* fondo estilo mapa oscuro */

background:
linear-gradient(rgba(15,23,42,.9),rgba(15,23,42,.9)),
url("https://images.unsplash.com/photo-1524661135-423995f22d0b");

background-size:cover;
background-position:center;
}

/* contenedor principal */

.login-wrapper{
width:1050px;
max-width:95%;
display:flex;
border-radius:18px;
overflow:hidden;

/* efecto glass */

background:rgba(255,255,255,.05);
backdrop-filter:blur(20px);

box-shadow:0 30px 80px rgba(0,0,0,.6);

animation:fadeLogin .6s ease;
}

@keyframes fadeLogin{
from{opacity:0; transform:translateY(30px);}
to{opacity:1; transform:translateY(0);}
}

/* lado izquierdo */

.login-left{
flex:1;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
padding:50px;
color:white;
text-align:center;
}

.login-left img{
width:360px;
max-width:100%;
margin-bottom:20px;

filter:drop-shadow(0 25px 45px rgba(0,0,0,.5));

animation:floatBus 6s ease-in-out infinite;
}

/* animación del bus */

@keyframes floatBus{
0%{transform:translateY(0)}
50%{transform:translateY(-10px)}
100%{transform:translateY(0)}
}

.login-left h2{
font-weight:700;
margin-bottom:10px;
}

.login-left p{
opacity:.85;
font-size:15px;
}

/* lado derecho */

.login-right{
flex:1;
background:white;
padding:60px;
display:flex;
flex-direction:column;
justify-content:center;
}

.logo{
font-size:30px;
font-weight:700;
margin-bottom:8px;
}

.subtitle{
color:#64748b;
margin-bottom:35px;
}

/* inputs */

.input-group{
margin-bottom:18px;
}

.input-group-text{
background:#f1f5f9;
border:none;
}

.form-control{
border:none;
background:#f1f5f9;
padding:12px;
transition:.2s;
}

.form-control:focus{
background:#e2e8f0;
box-shadow:0 0 0 2px #0ea5e9;
}

/* botón */

.btn-login{
width:100%;
padding:12px;
background:#0ea5e9;
border:none;
border-radius:8px;
font-weight:600;
transition:.2s;
}

.btn-login:hover{
background:#0284c7;
transform:translateY(-1px);
box-shadow:0 6px 14px rgba(14,165,233,.35);
}

/* error */

.alert-error{
background:#fee2e2;
color:#991b1b;
padding:10px;
border-radius:6px;
margin-top:15px;
text-align:center;
font-size:14px;
}

/* responsive */

@media (max-width:900px){

.login-wrapper{
flex-direction:column;
}

.login-left{
display:none;
}

.login-right{
padding:40px;
}

}

</style>

</head>

<body>

<div class="login-wrapper">

<!-- LADO IZQUIERDO -->

<div class="login-left">

<img src="{% static 'img/van.jpg' %}">

<h2>Control Transporte</h2>

<p>
Sistema inteligente para gestión y control de flota
</p>

</div>

<!-- LADO DERECHO -->

<div class="login-right">

<div class="logo">
🚍 Control Transporte
</div>

<div class="subtitle">
Acceso al sistema
</div>

<form method="POST">

{% csrf_token %}

<div class="input-group">

<span class="input-group-text">
<i class="fa fa-user"></i>
</span>

<input
type="text"
name="username"
class="form-control"
placeholder="Usuario"
required>

</div>

<div class="input-group">

<span class="input-group-text">
<i class="fa fa-lock"></i>
</span>

<input
type="password"
name="password"
class="form-control"
placeholder="Contraseña"
required>

</div>

<button type="submit" class="btn btn-login">
Entrar al sistema
</button>

{% if form.errors %}

<div class="alert-error">
Usuario o contraseña incorrectos
</div>

{% endif %}

</form>

</div>

</div>

</body>
</html>
