{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Control Transporte | Acceso</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(135deg,#0f172a,#1e293b,#334155);
font-family:system-ui,-apple-system,Segoe UI,Roboto;
}

.login-container{
width:1000px;
max-width:95%;
background:white;
border-radius:16px;
overflow:hidden;
display:flex;
box-shadow:0 30px 70px rgba(0,0,0,.35);
}

.login-image{
flex:1;
background:#0ea5e9;
display:flex;
align-items:center;
justify-content:center;
padding:40px;
}

.login-image img{
width:100%;
max-width:420px;
filter:drop-shadow(0 20px 40px rgba(0,0,0,.4));
}

.login-form{
flex:1;
padding:60px;
display:flex;
flex-direction:column;
justify-content:center;
}

.logo{
font-size:28px;
font-weight:700;
margin-bottom:5px;
}

.subtitle{
color:#64748b;
margin-bottom:35px;
}

.input-group{
margin-bottom:18px;
}

.input-group-text{
background:#f1f5f9;
border:none;
}

.form-control{
border:none;
background:#f1f5f9;
padding:12px;
}

.form-control:focus{
background:#e2e8f0;
box-shadow:0 0 0 2px #0ea5e9;
}

.btn-login{
width:100%;
padding:12px;
background:#0ea5e9;
border:none;
border-radius:8px;
font-weight:600;
}

.btn-login:hover{
background:#0284c7;
}

.alert-error{
background:#fee2e2;
color:#991b1b;
padding:10px;
border-radius:6px;
margin-top:15px;
text-align:center;
}

@media (max-width:900px){

.login-container{
flex-direction:column;
}

.login-image{
display:none;
}

.login-form{
padding:40px;
}

}

</style>

</head>

<body>

<div class="login-container">

<div class="login-image">

<img src="{% static 'img/van.jpg' %}">

</div>

<div class="login-form">

<div class="logo">
🚍 Control Transporte
</div>

<div class="subtitle">
Acceso al sistema
</div>

<form method="POST">
{% csrf_token %}

<div class="input-group">
<span class="input-group-text">
<i class="fa fa-user"></i>
</span>

<input
type="text"
name="username"
class="form-control"
placeholder="Usuario"
required>
</div>

<div class="input-group">
<span class="input-group-text">
<i class="fa fa-lock"></i>
</span>

<input
type="password"
name="password"
class="form-control"
placeholder="Contraseña"
required>
</div>

<button type="submit" class="btn btn-login">
Entrar al sistema
</button>

{% if form.errors %}
<div class="alert-error">
Usuario o contraseña incorrectos
</div>
{% endif %}

</form>

</div>

</div>

</body>
</html>
