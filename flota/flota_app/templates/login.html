{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Control Transporte | Acceso</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* ---------- BACKGROUND ---------- */

body{
height:100vh;
margin:0;
font-family:system-ui,-apple-system,Segoe UI,Roboto;
overflow:hidden;

background:
linear-gradient(rgba(10,20,40,.55),rgba(10,20,40,.85)),
url("{% static 'img/arequipa.png' %}");

background-size:cover;
background-position:center;
}

/* ---------- CITY LIGHT ---------- */

.city-light{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;

background:
radial-gradient(circle at 30% 70%, rgba(56,189,248,.25), transparent 40%),
radial-gradient(circle at 80% 20%, rgba(14,165,233,.25), transparent 40%);

animation:lightMove 12s linear infinite;

pointer-events:none;
z-index:1;
}

@keyframes lightMove{
0%{opacity:.6}
50%{opacity:1}
100%{opacity:.6}
}

/* ---------- AREA BUS ---------- */

.vehicle-area{

position:absolute;
left:5%;
bottom:7%;

width:480px;
height:260px;

z-index:2;

}

/* ---------- BUS ---------- */

.bus{

position:absolute;
left:0;
bottom:0;

width:420px;

filter:drop-shadow(0 35px 70px rgba(0,0,0,.8));

animation:busFloat 6s ease-in-out infinite;

}

@keyframes busFloat{

0%{transform:translateY(0)}
50%{transform:translateY(-8px)}
100%{transform:translateY(0)}

}

/* ---------- SOMBRA REALISTA ---------- */

.bus-shadow{

position:absolute;

left:70px;
bottom:-5px;

width:280px;
height:35px;

background:radial-gradient(
ellipse at center,
rgba(0,0,0,.55) 0%,
rgba(0,0,0,.35) 40%,
rgba(0,0,0,0) 80%
);

filter:blur(6px);

}

/* ---------- GLOW DE SUELO ---------- */

.bus-glow{

position:absolute;

left:90px;
bottom:-8px;

width:250px;
height:20px;

background:radial-gradient(
ellipse at center,
rgba(56,189,248,.6),
rgba(14,165,233,.2),
transparent
);

filter:blur(8px);

opacity:.6;

}

/* ---------- LOGIN BOX ---------- */

.login-box{

position:absolute;
right:8%;
top:50%;

transform:translateY(-50%);

width:420px;

padding:40px;

border-radius:18px;

background:rgba(20,30,50,.78);

backdrop-filter:blur(25px);

border:1px solid rgba(255,255,255,.15);

box-shadow:0 40px 120px rgba(0,0,0,.7);

color:white;

animation:fade .8s ease;

z-index:3;

}

@keyframes fade{

from{opacity:0; transform:translateY(30px)}
to{opacity:1; transform:translateY(0)}

}

/* ---------- TITULO ---------- */

.logo{
font-size:28px;
font-weight:700;
margin-bottom:6px;
}

.subtitle{
opacity:.8;
margin-bottom:30px;
}

/* ---------- INPUTS ---------- */

.input-group{
margin-bottom:18px;
}

.input-group-text{
background:rgba(255,255,255,.1);
border:none;
color:white;
}

.form-control{
background:rgba(255,255,255,.1);
border:none;
color:white;
}

.form-control::placeholder{
color:#cbd5f5;
}

.form-control:focus{
background:rgba(255,255,255,.15);
box-shadow:0 0 0 2px #38bdf8;
}

/* ---------- BOTON ---------- */

.btn-login{

width:100%;
padding:12px;

background:linear-gradient(135deg,#38bdf8,#0284c7);

border:none;
border-radius:8px;

font-weight:600;
color:white;

transition:.25s;

}

.btn-login:hover{

transform:translateY(-2px);
box-shadow:0 10px 25px rgba(2,132,199,.5);

}

/* ---------- RESPONSIVE ---------- */

@media(max-width:900px){

.vehicle-area{
display:none;
}

.login-box{
left:50%;
transform:translate(-50%,-50%);
width:90%;
}

}

</style>

</head>

<body>

<div class="city-light"></div>

<!-- BUS -->

<div class="vehicle-area">

<img src="{% static 'img/combi.png' %}" class="bus">

<div class="bus-shadow"></div>

<div class="bus-glow"></div>

</div>

<!-- LOGIN -->

<div class="login-box">

<div class="logo">
🚍 Control Transporte
</div>

<div class="subtitle">
Sistema de Gestión de Flotas | Arequipa
</div>

<form method="POST">

{% csrf_token %}

<div class="input-group">

<span class="input-group-text">
<i class="fa fa-user"></i>
</span>

<input type="text" name="username" class="form-control" placeholder="Usuario" required>

</div>

<div class="input-group">

<span class="input-group-text">
<i class="fa fa-lock"></i>
</span>

<input type="password" name="password" class="form-control" placeholder="Contraseña" required>

</div>

<button type="submit" class="btn btn-login">
Entrar al sistema
</button>

{% if form.errors %}

<div class="alert alert-danger mt-3">
Usuario o contraseña incorrectos
</div>

{% endif %}

</form>

</div>

</body>
</html>
